# The Flutter pod and SwiftPM are two paths to one on-device engine, and until
# 2026-09-16 nothing compared them: Package.swift served `essence2-v1.7.0` while
# the pod took a default from the PRIVATE engine repo and linked
# `essence2-v1.2.0` — a pre-release whose own title reads "superseded". Five
# releases apart, on one repo, for ten days. The plugin's own committed globs
# were written for the older archive, so the first macOS run of the day carried
# no audio encoder and the engine refused with -2.
#
# The engine adapter SOURCE was worse: `locate_engine_sdk` took a ref and both
# call sites omitted it, so the Swift compiled into the pod came from main HEAD
# at bootstrap time, into gitignored directories, with no revision recorded.
# `flutter-plugin-v2.6.1` named no engine at all.
#
# This is the gate. Offline, no credential, runs on a fork.
#
# 2026-10: the Flutter plugin moved to gitlab.com/bithuman/sdk/bithuman-flutter, which runs the pod
# arms (A1-A6, A8) against this repository's Package.swift. Here only A7 has a subject (Essence2Kit
# fetches its runtime files from the release essence2Tag names), so the control re-creates A7's
# defect: a tag roll that moves essence2Tag and not Essence2Resources.releaseTag.
name: apple engine pin

on:
  pull_request:
    paths:
      - 'Package.swift'
      - 'Sources/Essence2Kit/Essence2Engine.swift'
      - 'scripts/check-apple-engine-pin.sh'
  push:
    branches: [main]
    paths:
      - 'Package.swift'
      - 'Sources/Essence2Kit/Essence2Engine.swift'
      - 'scripts/check-apple-engine-pin.sh'
  workflow_dispatch:

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Essence2Kit names the engine SwiftPM serves (A7; the pod arms run in the plugin's project)
        run: ./scripts/check-apple-engine-pin.sh

      - name: Negative control — re-create the A7 defect, require a REFUSAL
        run: |
          set -u
          K=Sources/Essence2Kit/Essence2Engine.swift
          T="$(mktemp -d)"
          cp "$K" "$T/kit.bak"
          restore() { cp "$T/kit.bak" "$K"; }
          arm() {  # $1 = name, $2 = sed program
            sed -i.sedbak "$2" "$K" && rm -f "$K.sedbak"
            if cmp -s "$K" "$T/kit.bak"; then
              echo "::error::the arm '$1' changed no bytes — its sed no longer matches its subject, so it grades nothing"
              restore; exit 1
            fi
            if ./scripts/check-apple-engine-pin.sh > /dev/null 2>&1; then
              echo "::error::the pin check PASSED with '$1' applied — it is not looking"
              restore; exit 1
            fi
            echo "  refused: $1"
            restore
          }
          arm "Essence2Kit fetches its runtime files from an older engine release" \
              's|public static let releaseTag = "essence2-v[0-9.]*"|public static let releaseTag = "essence2-v1.2.0"|'
          arm "Essence2Kit's releaseTag is deleted" \
              '/public static let releaseTag = /d'
          ./scripts/check-apple-engine-pin.sh
