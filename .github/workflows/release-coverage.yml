# release-coverage.yml — did the newest CLI release LOSE a platform?
#
# `install.sh` resolves the newest `cli-v*` tag and downloads
# `bithuman-<target>.tar.gz` from it, so a release that carries fewer platforms
# than the one before it is not a partial success: it is a total outage for the
# missing platform, and it looks green from wherever the release was cut. That
# shipped on 2026-09-02 (`cli-v2.5.0`, macOS only; every Linux customer got a
# 404 from the documented one-liner).
#
# `tools/verify_release_platform_coverage.py` is the gate (RELEASE.md, "CLI
# platform coverage"). Until 2026-09-07 the only place it ran was the
# `verify-release-coverage` job of `release-cli.yml`, a dispatch-only lane that
# had cut no shipped release since 2026-08-02 and was deleted that day — so the
# safeguard ran on nothing. This workflow is where it lives now: it grades the
# release AFTER it is published, whichever lane cut it (the sanctioned lane is
# the CLI repo's tracked `scripts/release-macos.sh` + `scripts/release-linux.sh`,
# run on a signing host — not a workflow here), and it runs daily so a release
# published from a shell is graded within a day.
#
# The refusal arms are proven in-process first (`--self-test`, never a re-exec),
# so a green here is only trusted after the gate has been shown to fire.
# `--require` pins a floor independent of the predecessor; it is deliberately
# NOT set here because the two targets every release has carried since
# cli-v2.6.0 are exactly the predecessor's set, and a floor that the subject
# already satisfies is a guaranteed green (see the tool's docstring).
name: CLI releases — does the newest one still carry every platform its predecessor did?

on:
  release:
    types: [published]
  schedule:
    - cron: '17 6 * * *'
  # ★A FORMULA BUMP IS EXACTLY WHEN THE PIN CAN BREAK, so it is exactly when the
  #  anonymous-fetchability job below must run. Without this trigger the gate
  #  would first speak the morning AFTER a bad pin shipped.
  push:
    paths:
      - 'Formula/**'
      - 'install.sh'
      - 'scripts/check-formula-asset-anonymous.py'
      - '.github/workflows/release-coverage.yml'
  pull_request:
    paths:
      - 'Formula/**'
      - 'install.sh'
      - 'scripts/check-formula-asset-anonymous.py'
      - '.github/workflows/release-coverage.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'CLI release tag to grade (default: the newest cli-v* release)'
        type: string
        default: ''

permissions:
  contents: read

jobs:
  coverage:
    name: the release under test carries every platform its predecessor did
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: the gate can refuse (self-test, in-process)
        run: python3 tools/verify_release_platform_coverage.py --self-test

      - name: grade the release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          tag="${INPUT_TAG:-}"
          # a `release: published` event names the release under test only when
          # it is a CLI release; a Swift SDK tag (bare v*) or a Sparkle feed tag
          # falls through to the newest CLI release, which is what install.sh
          # would resolve anyway.
          if [ -z "$tag" ] && [ -n "${EVENT_TAG:-}" ] && printf '%s' "$EVENT_TAG" | grep -q '^cli-v'; then
            tag="$EVENT_TAG"
          fi
          if [ -n "$tag" ]; then
            python3 tools/verify_release_platform_coverage.py --tag "$tag"
          else
            python3 tools/verify_release_platform_coverage.py
          fi

  # ── ★THE FORMULA PIN, READ BACK THE WAY A STRANGER READS IT ──────────────
  # On 2026-09-11 `Formula/bithuman-cli.rb` was bumped to a release that was
  # still a DRAFT. A draft is fully visible to whoever cut it and to any token
  # with push access, and a flat 404 to everyone else — so `brew install
  # bithuman-product/bithuman/bithuman-cli` was broken for roughly eight hours
  # while every check the releaser could run said the asset was there. Nothing
  # in this tap read the release STATE back: `scripts/check-release-atomic.sh`
  # has a C4 FORMULA-PIN rule, but it grades against a manifest the caller
  # hands it, and it is wired in no workflow at all.
  #
  # ★THE JOB IS ONLY WORTH RUNNING BECAUSE IT RUNS WITHOUT CREDENTIALS. The gate
  # scrubs GH_TOKEN/GITHUB_TOKEN/netrc out of its own environment and ASSERTS
  # the scrub before its first request; with a token present a draft answers 200
  # and the whole thing is decoration. `permissions: {}` takes the job's own
  # token away as well, so there is nothing to leak into the check by accident.
  #
  # ★AND THE ARMS ARE PROVEN RED FIRST, against this tap's own permanent
  # history: a tag that has never existed, and a real release asked for a file
  # it does not carry. The draft case is the SAME code path as the first (R3,
  # "not visible anonymously") and was proven once against a real draft release
  # on 2026-09-11 — draft=true to an authenticated caller, HTTP 404 to an
  # anonymous one, gate rc=1.
  formula-pin-is-anonymously-fetchable:
    name: the formula's pinned asset downloads for someone with no credentials
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
      - name: the gate can refuse (parser + the anonymity primitive)
        timeout-minutes: 5
        run: python3 scripts/check-formula-asset-anonymous.py --self-test
      - name: ★the gate is proven RED before its green is read
        timeout-minutes: 5
        run: python3 scripts/check-formula-asset-anonymous.py --prove-by-mutation
      - name: grade the live formula pin
        timeout-minutes: 5
        run: python3 scripts/check-formula-asset-anonymous.py
