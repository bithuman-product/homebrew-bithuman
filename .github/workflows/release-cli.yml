# Build + publish the self-contained `bithuman` CLI tarballs (macOS arm64 +
# Linux x86_64) for a cli-vX.Y.Z release, with the expression-2 render host +
# engine VENDORED so `bithuman run` renders Wise Pup out of the box with ZERO
# engine fetch. Two jobs: `mac-tarball` and `linux-tarball` (see each below).
#
# This is the macOS-CLI analogue of release-pypi.yml (which builds the PyPI
# `bithuman` SDK wheel). It re-homes the mac tarball build that was cut by
# hand for cli-v2.3.x into a reproducible workflow, and adds the 2.4.0
# engine-vendoring step (the earlier distribution gap: the tarball must
# CARRY the engine, not rely on a hand-staged ~/.bithuman/lib).
#
# What it does (exactly the proven local build, scripts/bundle-macos.sh +
# scripts/check-engine-dedup.sh from bithuman-cli):
#   1. build `bithuman` --release on an Apple-Silicon runner (libessence.a
#      from bithuman-models at the Cargo.toml-pinned essence1-v* tag),
#   2. vendor the expression-2 render engine next to the binary
#      (bundle-macos.sh: EXPRESSION2_MODEL_BIN=expression2-model +
#      EMBODY_MODEL=embody.model) and bundle the Homebrew dylib closure,
#   3. drop the versioned engines/mac-arm64-<ver>.engine into the tree,
#   4. run the no-dup gate (the vendored .engine must be byte-identical to
#      the imx_fetch.rs ENGINES pin — DISTRIBUTION.md §13),
#   5. tar + sha256, upload to the cli-vX.Y.Z release, print the sha256 to
#      paste into Formula/bithuman-cli.rb.
#
# Engine-artifact sourcing (the "set EXPRESSION2_MODEL_BIN + EMBODY_MODEL +
# source those artifacts" fix):
#   * mac-arm64-<ver>.engine — PUBLIC: fetched from the imx_fetch.rs ENGINES
#     pin URL (Supabase `web` bucket) and sha-verified against the pin.
#   * expression2-model + embody.model — the mac render tool + shared CoreML
#     graph are NOT public; provide read URLs via the repo secrets
#     RENDER_TOOL_URL + EMBODY_MODEL_URL (a private store the runner can
#     read). Absent them the pairing gate in bundle-macos.sh fails the job —
#     a cloud/serve-only tarball is NOT a valid engine release.
#
# Secrets required (on homebrew-bithuman — ALL provisioned 2026-08-01):
#   BITHUMAN_CLI_SSH_KEY     read-only deploy key for the private CLI repo
#                            bithuman-product/bithuman (both checkout steps;
#                            the default GITHUB_TOKEN is scoped to THIS repo
#                            and cannot read it — first-run failure root cause)
#   BITHUMAN_MODELS_SSH_KEY  read-only deploy key for the private engine
#                            monorepo (same key cli-build.yml / release-pypi.yml use)
#   RENDER_TOOL_URL          authenticated URL to the mac expression2-model binary
#                            (private models-downloads store; sha cd3f053f…,
#                            the cli-v2.4.0-proven render tool)
#   EMBODY_MODEL_URL         authenticated URL to the mac embody.model graph
#                            (private models-downloads store; sha 90e4cf31cf71…,
#                            the BLESSED live archive — byte-exact, never repacked)
#   GITHUB_TOKEN             (built-in) — upload the asset to the release
#
# Still dispatch-only by choice; secrets are wired, so `push: tags: [cli-v*]`
# may be added once a tag-cut release is wanted.
name: release-cli

on:
  workflow_dispatch:
    inputs:
      cli_ref:
        description: 'bithuman-cli git ref to build (release/2.4.0, a cli-vX.Y.Z tag, or a SHA).'
        type: string
        default: main
      engine_version:
        description: 'Vendored mac engine version (matches the imx_fetch.rs ENGINES pin, e.g. 1.0.0).'
        type: string
        default: '1.0.0'
      release_tag:
        description: 'Release tag to upload the tarball to (must already exist, e.g. cli-v2.4.0).'
        type: string
        required: true

permissions:
  contents: write            # upload the tarball asset to the Release

jobs:
  mac-tarball:
    name: macOS arm64 self-contained CLI tarball (engine vendored)
    runs-on: macos-15         # Apple Silicon + current Xcode (webrtc-sys C++ bridge)
    timeout-minutes: 60
    env:
      CLI_REF: ${{ inputs.cli_ref }}
      ENGINE_VERSION: ${{ inputs.engine_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RENDER_TOOL_URL: ${{ secrets.RENDER_TOOL_URL }}
      EMBODY_MODEL_URL: ${{ secrets.EMBODY_MODEL_URL }}
      GH_TOKEN: ${{ github.token }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout bithuman (private CLI repo — needs the deploy key)
        uses: actions/checkout@v4
        with:
          repository: bithuman-product/bithuman
          ref: ${{ inputs.cli_ref }}
          path: cli
          # bithuman-product/bithuman is PRIVATE; this repo's default
          # GITHUB_TOKEN cannot read it (the exact first-run failure of
          # 2026-08-01). Read-only deploy key on the bithuman repo.
          ssh-key: ${{ secrets.BITHUMAN_CLI_SSH_KEY }}

      - name: Toolchain (brew engine deps + rust)
        run: |
          brew install cmake ninja onnxruntime hdf5 jpeg-turbo webp ffmpeg
          rustup default stable && rustc --version

      - name: Load the bithuman-models deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BITHUMAN_MODELS_SSH_KEY }}

      - name: Configure git auth for private bithuman-models
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build libessence.a (pinned essence1-v* tag from Cargo.toml)
        run: |
          set -euo pipefail
          # The tag the CLI pins the `bithuman` crate to = the ABI to link.
          TAG=$(grep -m1 'tag = "essence1-' cli/Cargo.toml | sed -E 's/.*tag = "([^"]+)".*/\1/')
          echo "engine tag: $TAG"
          git clone --depth 1 --branch "$TAG" \
              https://github.com/bithuman-product/bithuman-models "$RUNNER_TEMP/bm"
          ESRC="$RUNNER_TEMP/bm/models/essence-1"
          cmake -GNinja -B "$ESRC/engine/essence/build" -S "$ESRC/engine/essence" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$ESRC/engine/essence/build" --target essence --parallel "$(sysctl -n hw.ncpu)"
          test -f "$ESRC/engine/essence/build/libessence.a"
          echo "ESSENCE_BUILD_DIR=$ESRC/engine/essence/build" >> "$GITHUB_ENV"

      - name: cargo build --release -p bithuman-cli
        working-directory: cli
        run: cargo build --release -p bithuman-cli && ./target/release/bithuman --version

      - name: Source the vendored engine artifacts
        working-directory: cli
        run: |
          set -euo pipefail
          # mac-arm64 .engine — PUBLIC pin URL from imx_fetch.rs; sha-verified by the no-dup gate.
          ENG_URL=$(grep -o 'https://[^"]*mac-arm64-'"$ENGINE_VERSION"'\.engine' \
                    crates/bithuman-cli/src/expression2/imx_fetch.rs | head -1)
          echo "engine url: $ENG_URL"
          mkdir -p engine-src
          curl -fsSL -o "engine-src/mac-arm64-$ENGINE_VERSION.engine" "$ENG_URL"
          # expression2-model + embody.model — private; from repo-secret URLs.
          : "${RENDER_TOOL_URL:?set the RENDER_TOOL_URL secret}"
          : "${EMBODY_MODEL_URL:?set the EMBODY_MODEL_URL secret}"
          curl -fsSL -o engine-src/expression2-model "$RENDER_TOOL_URL"
          curl -fsSL -o engine-src/embody.model "$EMBODY_MODEL_URL"

      # ─────────────────────────────────────────────────────────────────
      # THE ESSENCE-2 ENGINE. This step did not exist, and its absence is the
      # whole defect: this job set EXPRESSION2_MODEL_BIN and EMBODY_MODEL and
      # never set LIBESSENCE2_DYLIB, so bundle-macos.sh's essence-2 block was a
      # silent no-op. MEASURED on the published cli-v2.4.2 tarball
      # (bithuman-aarch64-apple-darwin.tar.gz, 276,335,811 B, 99 entries,
      # listed 2026-08-29): no libessence2.dylib, no essence-2 resources, no
      # tessera anything — while the shipped binary's own load() error told
      # users to install this tarball "because it vendors libessence2 next to
      # the binary".
      #
      # IT IS BUILDABLE. On an Apple-Silicon host, cli/scripts/make-libessence2-
      # dylib.sh re-links the pinned static archive out of
      # essence2-libessence2-v1.0-a2x into a 56 MB dylib exporting all 15
      # be_essence2_* entry points (measured on moraga 2026-08-29; a dlopen +
      # dlsym probe resolved them, with a negative control that resolved none).
      # Nothing here is blocked on a missing artifact.
      #
      # ★WHAT IT IS BLOCKED ON, AND IT IS AN OWNER ACTION: this repo has no
      # credential that can READ bithuman-product/bithuman-models RELEASE
      # ASSETS. It holds two SSH DEPLOY KEYS (BITHUMAN_CLI_SSH_KEY,
      # BITHUMAN_MODELS_SSH_KEY) which clone git over ssh — release assets are
      # not in git and are not reachable over ssh — plus this repo's own
      # GITHUB_TOKEN, which is scoped to homebrew-bithuman. So this step needs
      # ONE new secret, BITHUMAN_MODELS_RELEASE_TOKEN: a token with read access
      # to bithuman-models releases. With it, the next tarball ships essence-2.
      # Without it, the tarball is honestly DECLARED essence-2-less rather than
      # silently shipped as one, and this job says so in the log.
      #
      # ★SIZE, so nobody is surprised by it: the resources are 373 MB extracted,
      # 366 MB of which is the shared a2x_w2v.fp32.onnx frontend, plus the
      # 56 MB dylib. A complete tarball is therefore roughly 2x today's 276 MB.
      # That is a real product trade (every `brew install` pays it) and it is
      # the owner's to make — which is another reason this step is opt-in by
      # secret rather than switched on unilaterally.
      - name: Source the essence-2 engine (libessence2) — or declare its absence
        working-directory: cli
        env:
          MODELS_TOKEN: ${{ secrets.BITHUMAN_MODELS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Keep the pin in ONE place: read it out of the SDK manifest that
          # already owns it rather than restating the tag here, so a re-pin
          # cannot leave this job fetching the previous engine.
          E2_REPO=bithuman-product/bithuman-models
          E2_TAG=essence2-libessence2-v1.0-a2x
          if [ -z "${MODELS_TOKEN:-}" ]; then
            echo "::warning::BITHUMAN_MODELS_RELEASE_TOKEN is not set — this tarball will ship NO essence-2 engine."
            echo "::warning::the command 'bithuman run <X.elevatedir>' will fail on it with: could not load libessence2.dylib"
            echo "::warning::Add a token with read access to $E2_REPO releases to ship the engine."
            echo "BITHUMAN_TARBALL_NO_ESSENCE2=1" >> "$GITHUB_ENV"
            exit 0
          fi
          mkdir -p e2-src && cd e2-src
          GH_TOKEN="$MODELS_TOKEN" gh release download "$E2_TAG" --repo "$E2_REPO" \
            -p 'libessence2.xcframework.zip' -p 'onnxruntime.xcframework.zip' \
            -p 'libessence2-resources.zip' --clobber
          # bootstrap.sh's own sha256 pins, restated here so a swapped asset is
          # caught at BUILD time rather than at a customer's first render.
          echo "88ea9959991b07a0fc4dee2f1142019554b210f7ac0580295d25d8d329786f73  libessence2.xcframework.zip" | shasum -a 256 -c -
          echo "94ce2120e59de3c039165a26ff95eb15be6085a142864e2e091169586d99aa22  libessence2-resources.zip"   | shasum -a 256 -c -
          unzip -oq libessence2.xcframework.zip
          unzip -oq onnxruntime.xcframework.zip
          mkdir -p resources && unzip -oq libessence2-resources.zip -d resources
          # ★THE BORROW GATE, ON THE SLICE, BEFORE ANY OF IT IS BUILT.
          #
          # essence-2's bar is an owner ruling and a switch, not a gradient:
          # teeth are BORROWED from the audio-driven teacher on every lane,
          # with zero synthesis and never a synthesizing fallback. The engine
          # this step just digest-verified does NOT clear that bar — measured
          # 2026-09-02 on these exact bytes, all three slices score
          # tessera_bank 0 / tessera_head 0 while the instrument's own controls
          # fire (a2x 214/174/172, be_essence2_create 12). It cannot open the
          # donor bank; there is no borrow code in it.
          #
          # cli/scripts/bundle-macos.sh refuses it too (that is the load-bearing
          # gate, one step before the copy that would make it part of the
          # tarball). This runs the SAME check here so the failure is attributed
          # to the engine at the moment it is fetched, instead of forty minutes
          # later inside an assembly step — and so the reason lands next to the
          # secret whose arrival caused it.
          #
          # WHEN THE ENGINE LEARNS TO BORROW this turns green on its own and
          # nothing here needs editing.
          # `cli_ref` is a dispatch input, so it can name a ref that predates
          # the gate. "The gate file is absent" and "the engine is fine" must
          # never look the same from here.
          if [ ! -f ../scripts/check-libessence2-borrows.sh ]; then
            echo "::error::cli_ref '${{ inputs.cli_ref }}' has no scripts/check-libessence2-borrows.sh."
            echo "::error::Refusing to vendor an essence-2 engine no gate has read. Build from a cli_ref"
            echo "::error::at or after bithuman-product/bithuman 60195fe, or unset"
            echo "::error::BITHUMAN_MODELS_RELEASE_TOKEN to ship a tarball without essence-2."
            exit 1
          fi
          bash ../scripts/check-libessence2-borrows.sh \
            "$PWD/libessence2.xcframework/macos-arm64/libessence2.a" || {
              rc=$?
              echo "::error::REFUSING to build a macOS tarball around this essence-2 engine (gate rc=$rc)."
              echo "::error::rc=3 it SYNTHESIZES teeth — it never references the frozen donor-bank members."
              echo "::error::rc=2 it could not be inspected — a gate that cannot read must not guess."
              echo "::error::Fix the ENGINE (bithuman-models models/essence-2: port the TESSERA TeethPass"
              echo "::error::into the CoreML/ANE core and cut a new pinned release), then re-run. To ship a"
              echo "::error::tarball WITHOUT essence-2 in the meantime, unset BITHUMAN_MODELS_RELEASE_TOKEN."
              exit "$rc"; }
          LIBESSENCE2_A="$PWD/libessence2.xcframework/macos-arm64/libessence2.a" \
          ONNXRUNTIME_FW="$PWD/onnxruntime.xcframework/macos-arm64_x86_64" \
          OUT="$PWD/libessence2.dylib" \
            bash ../scripts/make-libessence2-dylib.sh
          echo "LIBESSENCE2_DYLIB=$PWD/libessence2.dylib" >> "$GITHUB_ENV"
          echo "LIBESSENCE2_RESOURCES=$PWD/resources" >> "$GITHUB_ENV"

      - name: Assemble tarball (bundle-macos.sh vendors engine + dylibs) + no-dup gate
        working-directory: cli
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"; rm -rf "$STAGE"; mkdir -p "$STAGE/engines"
          cp target/release/bithuman "$STAGE/bithuman"
          # LIBESSENCE2_* are set by the step above only when the engine was
          # sourced; bundle-macos.sh treats unset as "no essence-2" and its
          # pairing gate then REFUSES the build unless
          # BITHUMAN_TARBALL_NO_ESSENCE2=1 declares that on purpose (which the
          # step above sets when the token is missing). Forgetting them can no
          # longer produce a silently essence-2-less tarball.
          EXPRESSION2_MODEL_BIN="$PWD/engine-src/expression2-model" \
          EMBODY_MODEL="$PWD/engine-src/embody.model" \
          LIBESSENCE2_DYLIB="${LIBESSENCE2_DYLIB:-}" \
          LIBESSENCE2_RESOURCES="${LIBESSENCE2_RESOURCES:-}" \
          BITHUMAN_TARBALL_NO_ESSENCE2="${BITHUMAN_TARBALL_NO_ESSENCE2:-0}" \
            bash scripts/bundle-macos.sh "$STAGE/bithuman"
          cp "engine-src/mac-arm64-$ENGINE_VERSION.engine" "$STAGE/engines/"
          BIN_DIR="$STAGE" bash scripts/check-engine-dedup.sh      # DISTRIBUTION.md §13
          TGZ="$RUNNER_TEMP/bithuman-aarch64-apple-darwin.tar.gz"
          # ★THE FILE LIST USED TO BE HAND-WRITTEN: `tar ... bithuman lib
          # expression2-model embody.model engines`. That list is a SECOND
          # place a vendored file can be dropped, silently and after every
          # gate has passed — libessence2.dylib and the essence-2 resource
          # bundles are vendored into $STAGE by bundle-macos.sh and would have
          # been left on the floor by this line even once everything upstream
          # was correct. Archive what the staging directory actually CONTAINS,
          # so vendoring and shipping cannot diverge again.
          ( cd "$STAGE" && COPYFILE_DISABLE=1 tar --no-xattrs --exclude '._*' \
              -czf "$TGZ" . )
          # Say what shipped, in the log, at the size it shipped — the cheapest
          # possible check on "did the engine make it in".
          echo "tarball contents (top level):"
          tar tzf "$TGZ" | sed 's|^\./||' | awk -F/ 'NF<=1 && $0!=""' | sort -u
          if tar tzf "$TGZ" | grep -q 'libessence2\.dylib'; then
            echo "::notice::this tarball VENDORS the essence-2 engine"
          else
            echo "::warning::this tarball ships NO essence-2 engine (declared)"
          fi
          shasum -a 256 "$TGZ" | tee "$TGZ.sha256"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Upload tarball to the release + emit formula sha
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo bithuman-product/homebrew-bithuman --clobber \
            "$TGZ" "$TGZ.sha256"
          echo "::notice::Formula sha256 for cli $RELEASE_TAG = $(cut -d' ' -f1 "$TGZ.sha256")"

  # ──────────────────────────────────────────────────────────────────
  # Linux x86_64 lane — the analogue of mac-tarball, so `bithuman run` renders
  # Wise Pup out of the box on Linux with a ZERO-fetch embedded engine (the gap
  # cli-v2.4.0's first cut had: the tarball shipped the binary but no render
  # host). The LiteRT host is a BUILT artifact (unlike the mac Swift tool), so
  # this job builds it in-workflow from the bithuman-models source rather than
  # pulling a secret URL — fully reproducible from public + deploy-key inputs.
  #   1. cross-compile `bithuman` in the pinned manylinux_2_28 image (glibc 2.28),
  #   2. build `expression2-model` = PyInstaller --onefile of the #278 split host
  #      (render_stream_host_litert.py) + pinned ai_edge_litert/numpy, on Ubuntu
  #      22.04 (glibc 2.35 → Ubuntu 22.04+/Debian 12+/RHEL 9+),
  #   3. fetch the sha-pinned linux-x64-<ver>.engine (PUBLIC url from imx_fetch.rs),
  #   4. build-linux.sh vendors host + engine + runs BOTH gates (no-dup +
  #      host↔engine render compatibility) + tars {bithuman,lib,expression2-model,
  #      engines}, then uploads.
  linux-tarball:
    name: Linux x86_64 self-contained CLI tarball (host + engine vendored)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLI_REF: ${{ inputs.cli_ref }}
      ENGINE_VERSION: ${{ inputs.engine_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout bithuman (private CLI repo — needs the deploy key)
        uses: actions/checkout@v4
        with:
          repository: bithuman-product/bithuman
          ref: ${{ inputs.cli_ref }}
          path: cli
          # bithuman-product/bithuman is PRIVATE; this repo's default
          # GITHUB_TOKEN cannot read it (the exact first-run failure of
          # 2026-08-01). Read-only deploy key on the bithuman repo.
          ssh-key: ${{ secrets.BITHUMAN_CLI_SSH_KEY }}

      - name: Load the bithuman-models deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BITHUMAN_MODELS_SSH_KEY }}

      - name: Configure git auth for private bithuman-models
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Clone bithuman-models (engine src + manylinux Dockerfile + LiteRT host src)
        run: |
          set -euo pipefail
          TAG=$(grep -m1 'tag = "essence1-' cli/Cargo.toml | sed -E 's/.*tag = "([^"]+)".*/\1/')
          echo "engine tag: $TAG"
          git clone --depth 1 --branch "$TAG" \
              https://github.com/bithuman-product/bithuman-models bithuman-models
          echo "BM=$PWD/bithuman-models" >> "$GITHUB_ENV"
          # The LiteRT render host lives on a DIFFERENT axis than the essence-1
          # ABI tag: models/expression-2/engine/cpu/serve/render_stream_host_litert.py
          # does not exist at essence1-v* tags (proven: first dispatch died at
          # `test -f $HOSTSRC`, 2026-08-01 run 30715617689). Host source comes
          # from bithuman-models MAIN; the host↔engine render-compat gate in
          # build-linux.sh still validates the pairing against the pinned engine.
          git clone --depth 1 \
              https://github.com/bithuman-product/bithuman-models bithuman-models-main
          echo "BM_MAIN=$PWD/bithuman-models-main" >> "$GITHUB_ENV"

      - name: Build the pinned manylinux_2_28 image (the `bithuman` glibc 2.28 floor)
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t libessence/manylinux-x86_64:0.1 \
            -f "$BM/models/essence-1/sdk/python/scripts/Dockerfile.manylinux-x86_64" \
            "$BM/models/essence-1/sdk/python/scripts"

      - name: Build the LiteRT render host (expression2-model, glibc 2.35 floor)
        run: |
          set -euo pipefail
          HOSTSRC="$BM_MAIN/models/expression-2/engine/cpu/serve/render_stream_host_litert.py"
          test -f "$HOSTSRC"   # the #278 two-interpreter split host (main-axis, see clone step)
          mkdir -p host-build && cp "$HOSTSRC" host-build/
          docker run --rm --platform linux/amd64 -v "$PWD/host-build":/work ubuntu:22.04 bash -c '
            set -e; export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip binutils >/dev/null
            cd /work && python3 -m venv v && ./v/bin/pip -q install --upgrade pip wheel
            ./v/bin/pip -q install "ai_edge_litert==2.1.6" "numpy==2.2.6" "pyinstaller==6.21.0"
            ./v/bin/pyinstaller --onefile --name expression2-model --distpath d --workpath b \
              --collect-all ai_edge_litert --collect-submodules numpy --console render_stream_host_litert.py'
          test -f host-build/d/expression2-model
          echo "HOST=$PWD/host-build/d/expression2-model" >> "$GITHUB_ENV"

      - name: Source the vendored engine + probe imx (PUBLIC pins from the CLI source)
        working-directory: cli
        run: |
          set -euo pipefail
          ENG_URL=$(grep -o 'https://[^"]*linux-x64-'"$ENGINE_VERSION"'\.engine' \
                    crates/bithuman-cli/src/expression2/imx_fetch.rs | head -1)
          echo "engine url: $ENG_URL"
          curl -fsSL -o "$RUNNER_TEMP/linux-x64-$ENGINE_VERSION.engine" "$ENG_URL"
          echo "EXPRESSION2_ENGINE_FILE=$RUNNER_TEMP/linux-x64-$ENGINE_VERSION.engine" >> "$GITHUB_ENV"
          IMX_URL=$(grep -o 'https://[^"]*wise-pup\.imx' crates/bithuman-cli/src/cmd/models.rs | head -1)
          curl -fsSL -o "$RUNNER_TEMP/probe.imx" "$IMX_URL"
          echo "EXPRESSION2_PROBE_IMX=$RUNNER_TEMP/probe.imx" >> "$GITHUB_ENV"

      - name: Build + vendor + gate the linux tarball (scripts/build-linux.sh)
        working-directory: cli
        env:
          EXPRESSION2_MODEL_BIN: ${{ env.HOST }}
          # EXPRESSION2_ENGINE_FILE + EXPRESSION2_PROBE_IMX exported above; keep
          # the compose tree on the workspace FS so cp -al hardlinks work.
          BITHUMAN_CLI_COMPOSE_DIR: ${{ github.workspace }}/compose-cli-linux
        run: |
          set -euo pipefail
          # x86_64: manylinux cross-compile of `bithuman`, then _vendor_expr2_linux
          # stages expression2-model + engines/linux-x64-<ver>.engine, runs the
          # no-dup + host↔engine gates, and tars the self-contained bundle.
          BITHUMAN_SDK_ROOT="$BM/models/essence-1" bash scripts/build-linux.sh x86_64
          TGZ="$PWD/dist/bithuman-x86_64-unknown-linux-gnu.tar.gz"
          test -f "$TGZ"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Upload linux tarball to the release + emit sha
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" --repo bithuman-product/homebrew-bithuman --clobber \
            "$TGZ" "$TGZ.sha256"
          echo "::notice::Linux tarball sha256 for cli $RELEASE_TAG = $(cut -d' ' -f1 "$TGZ.sha256")"
