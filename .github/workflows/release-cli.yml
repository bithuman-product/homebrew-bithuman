# Build + publish the self-contained `bithuman` CLI tarballs (macOS arm64 +
# Linux x86_64) for a cli-vX.Y.Z release, with the expression-2 render host +
# engine VENDORED so `bithuman run` renders Wise Pup out of the box with ZERO
# engine fetch. Two jobs: `mac-tarball` and `linux-tarball` (see each below).
#
# This is the macOS-CLI analogue of release-pypi.yml (which builds the PyPI
# `bithuman` SDK wheel). It re-homes the mac tarball build that was cut by
# hand for cli-v2.3.x into a reproducible workflow, and adds the 2.4.0
# engine-vendoring step (the earlier distribution gap: the tarball must
# CARRY the engine, not rely on a hand-staged ~/.bithuman/lib).
#
# What it does (exactly the proven local build, scripts/bundle-macos.sh +
# scripts/check-engine-dedup.sh from bithuman-cli):
#   1. build `bithuman` --release on an Apple-Silicon runner (libessence.a
#      from bithuman-models at the Cargo.toml-pinned essence1-v* tag),
#   2. vendor the expression-2 render engine next to the binary
#      (bundle-macos.sh: EXPRESSION2_MODEL_BIN=expression2-model +
#      EMBODY_MODEL=embody.model) and bundle the Homebrew dylib closure,
#   3. drop the versioned engines/mac-arm64-<ver>.engine into the tree,
#   4. run the no-dup gate (the vendored .engine must be byte-identical to
#      the imx_fetch.rs ENGINES pin — DISTRIBUTION.md §13),
#   5. tar + sha256, upload to the cli-vX.Y.Z release, print the sha256 to
#      paste into Formula/bithuman-cli.rb.
#
# Engine-artifact sourcing (the "set EXPRESSION2_MODEL_BIN + EMBODY_MODEL +
# source those artifacts" fix):
#   * mac-arm64-<ver>.engine — PUBLIC: fetched from the imx_fetch.rs ENGINES
#     pin URL (Supabase `web` bucket) and sha-verified against the pin.
#   * expression2-model + embody.model — the mac render tool + shared CoreML
#     graph are NOT public; provide read URLs via the repo secrets
#     RENDER_TOOL_URL + EMBODY_MODEL_URL (a private store the runner can
#     read). Absent them the pairing gate in bundle-macos.sh fails the job —
#     a cloud/serve-only tarball is NOT a valid engine release.
#
# Secrets required (on homebrew-bithuman — ALL provisioned 2026-08-01):
#   BITHUMAN_CLI_SSH_KEY     read-only deploy key for the private CLI repo
#                            bithuman-product/bithuman (both checkout steps;
#                            the default GITHUB_TOKEN is scoped to THIS repo
#                            and cannot read it — first-run failure root cause)
#   BITHUMAN_MODELS_SSH_KEY  read-only deploy key for the private engine
#                            monorepo (same key cli-build.yml / release-pypi.yml use)
#   RENDER_TOOL_URL          authenticated URL to the mac expression2-model binary
#                            (private models-downloads store; sha cd3f053f…,
#                            the cli-v2.4.0-proven render tool)
#   EMBODY_MODEL_URL         authenticated URL to the mac embody.model graph
#                            (private models-downloads store; sha 90e4cf31cf71…,
#                            the BLESSED live archive — byte-exact, never repacked)
#   GITHUB_TOKEN             (built-in) — upload the asset to the release
#
# Secrets required for SIGNING + NOTARIZATION (★NOT YET PROVISIONED as of
# 2026-09-02 — `gh secret list` on this repo shows none of them, and the three
# inherited org secrets are Azure-only). Until they exist this job REFUSES to
# publish a mac tarball unless it is re-dispatched with allow_unsigned=true:
#   MACOS_CERT_P12_BASE64    base64 of the "Developer ID Application: bitHuman
#                            Inc. (G64NFNZX84)" identity exported as .p12 WITH
#                            its private key. The certificate itself already
#                            exists — it is in the login keychain on alpharetta,
#                            valid 2026-04-15 -> 2027-02-01. Export it from
#                            Keychain Access; it has never been used to ship.
#   MACOS_CERT_P12_PASSWORD  the .p12 export password
#   and ONE of:
#     NOTARY_KEY_P8_BASE64 + NOTARY_KEY_ID + NOTARY_ISSUER   (preferred; an
#       App Store Connect API key. NOTARY_ISSUER is the UUID from App Store
#       Connect > Users and Access > Integrations — it is NOT derivable from
#       the .p8 and is not recorded anywhere in this estate.)
#     NOTARY_APPLE_ID + NOTARY_TEAM_ID + NOTARY_PASSWORD     (Apple ID + an
#       app-specific password; NOTARY_TEAM_ID=G64NFNZX84)
#
# PUBLISHING SAFETY -- release_tag is free text, so aim it carefully
#   `release_tag` is a plain string input naming an EXISTING release. Both jobs
#   used to end in a bare `gh release upload ... --clobber`, which DELETES the
#   asset already there and puts the new bytes in its place. That made an
#   already-published release one typo away from being replaced under the
#   customers installing it -- and the Homebrew formula pins a sha256 against
#   those exact URLs, so a replacement breaks `brew install` until the formula
#   is re-pinned. Worse, the `linux-tarball` job had NO gate of any kind, so a
#   dispatch aimed only at exercising the mac signing path would still rebuild
#   and overwrite the published Linux tarball while the mac job beside it
#   correctly refused to publish anything at all.
#
#   Three inputs now bound that:
#     build_mac / build_linux    run only the lane you actually want (default
#                                true; turn one OFF for a single-platform re-cut)
#     overwrite_published        REQUIRED to replace an asset that already
#                                exists on release_tag. Default false, and
#                                scripts/upload-release-asset.sh refuses --
#                                naming the asset, its size, its upload date
#                                and its download count -- rather than clobber.
#
# Still dispatch-only by choice; secrets are wired, so `push: tags: [cli-v*]`
# may be added once a tag-cut release is wanted.
name: release-cli

on:
  workflow_dispatch:
    inputs:
      cli_ref:
        description: 'bithuman-cli git ref to build (release/2.4.0, a cli-vX.Y.Z tag, or a SHA).'
        type: string
        default: main
      engine_version:
        description: 'Vendored mac engine version (matches the imx_fetch.rs ENGINES pin, e.g. 1.0.0).'
        type: string
        default: '1.0.0'
      release_tag:
        description: 'Release tag to upload the tarball to (must already exist, e.g. cli-v2.4.0).'
        type: string
        required: true
      allow_unsigned:
        description: 'Publish an AD-HOC (Gatekeeper-rejected) mac tarball. Leave false unless you mean it.'
        type: boolean
        default: false
      build_mac:
        description: 'Build + publish the macOS arm64 tarball.'
        type: boolean
        default: true
      build_linux:
        description: 'Build + publish the Linux x86_64 tarball. Turn OFF for a mac-only re-cut -- otherwise this job rebuilds the Linux tarball for release_tag whether or not you wanted a new one.'
        type: boolean
        default: true
      overwrite_published:
        description: 'REPLACE assets that are already on release_tag. Leave false unless you mean it -- the Homebrew formula pins a sha256 against those exact URLs.'
        type: boolean
        default: false

permissions:
  contents: write            # upload the tarball asset to the Release

jobs:
  mac-tarball:
    name: macOS arm64 self-contained CLI tarball (engine vendored)
    if: inputs.build_mac
    runs-on: macos-15         # Apple Silicon + current Xcode (webrtc-sys C++ bridge)
    timeout-minutes: 60
    env:
      CLI_REF: ${{ inputs.cli_ref }}
      ENGINE_VERSION: ${{ inputs.engine_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RENDER_TOOL_URL: ${{ secrets.RENDER_TOOL_URL }}
      EMBODY_MODEL_URL: ${{ secrets.EMBODY_MODEL_URL }}
      GH_TOKEN: ${{ github.token }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout bithuman (private CLI repo — needs the deploy key)
        uses: actions/checkout@v4
        with:
          repository: bithuman-product/bithuman
          ref: ${{ inputs.cli_ref }}
          path: cli
          # bithuman-product/bithuman is PRIVATE; this repo's default
          # GITHUB_TOKEN cannot read it (the exact first-run failure of
          # 2026-08-01). Read-only deploy key on the bithuman repo.
          ssh-key: ${{ secrets.BITHUMAN_CLI_SSH_KEY }}

      - name: Checkout this tap (scripts/sign-macos.sh + notarize + verify)
        uses: actions/checkout@v4
        with:
          path: tap

      - name: Toolchain (brew engine deps + rust)
        run: |
          brew install cmake ninja onnxruntime hdf5 jpeg-turbo webp ffmpeg
          rustup default stable && rustc --version

      - name: Load the bithuman-models deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BITHUMAN_MODELS_SSH_KEY }}

      - name: Configure git auth for private bithuman-models
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Build libessence.a (pinned essence1-v* tag from Cargo.toml)
        run: |
          set -euo pipefail
          # The tag the CLI pins the `bithuman` crate to = the ABI to link.
          TAG=$(grep -m1 'tag = "essence1-' cli/Cargo.toml | sed -E 's/.*tag = "([^"]+)".*/\1/')
          echo "engine tag: $TAG"
          git clone --depth 1 --branch "$TAG" \
              https://github.com/bithuman-product/bithuman-models "$RUNNER_TEMP/bm"
          ESRC="$RUNNER_TEMP/bm/models/essence-1"
          cmake -GNinja -B "$ESRC/engine/essence/build" -S "$ESRC/engine/essence" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$ESRC/engine/essence/build" --target essence --parallel "$(sysctl -n hw.ncpu)"
          test -f "$ESRC/engine/essence/build/libessence.a"
          echo "ESSENCE_BUILD_DIR=$ESRC/engine/essence/build" >> "$GITHUB_ENV"

      - name: cargo build --release -p bithuman-cli
        working-directory: cli
        run: cargo build --release -p bithuman-cli && ./target/release/bithuman --version

      - name: Source the vendored engine artifacts
        working-directory: cli
        run: |
          set -euo pipefail
          # mac-arm64 .engine — PUBLIC pin URL from imx_fetch.rs; sha-verified by the no-dup gate.
          ENG_URL=$(grep -o 'https://[^"]*mac-arm64-'"$ENGINE_VERSION"'\.engine' \
                    crates/bithuman-cli/src/expression2/imx_fetch.rs | head -1)
          echo "engine url: $ENG_URL"
          mkdir -p engine-src
          curl -fsSL -o "engine-src/mac-arm64-$ENGINE_VERSION.engine" "$ENG_URL"
          # expression2-model + embody.model — private; from repo-secret URLs.
          : "${RENDER_TOOL_URL:?set the RENDER_TOOL_URL secret}"
          : "${EMBODY_MODEL_URL:?set the EMBODY_MODEL_URL secret}"
          curl -fsSL -o engine-src/expression2-model "$RENDER_TOOL_URL"
          curl -fsSL -o engine-src/embody.model "$EMBODY_MODEL_URL"

      # ─────────────────────────────────────────────────────────────────
      # THE ESSENCE-2 ENGINE. This step did not exist, and its absence is the
      # whole defect: this job set EXPRESSION2_MODEL_BIN and EMBODY_MODEL and
      # never set LIBESSENCE2_DYLIB, so bundle-macos.sh's essence-2 block was a
      # silent no-op. MEASURED on the published cli-v2.4.2 tarball
      # (bithuman-aarch64-apple-darwin.tar.gz, 276,335,811 B, 99 entries,
      # listed 2026-08-29): no libessence2.dylib, no essence-2 resources, no
      # tessera anything — while the shipped binary's own load() error told
      # users to install this tarball "because it vendors libessence2 next to
      # the binary".
      #
      # IT IS BUILDABLE. On an Apple-Silicon host, cli/scripts/make-libessence2-
      # dylib.sh re-links the pinned static archive out of
      # the pinned libessence2 release into a 56 MB dylib exporting all 15
      # be_essence2_* entry points (measured on moraga 2026-08-29; a dlopen +
      # dlsym probe resolved them, with a negative control that resolved none).
      # Nothing here is blocked on a missing artifact.
      #
      # ★WHAT IT IS BLOCKED ON, AND IT IS AN OWNER ACTION: this repo has no
      # credential that can READ bithuman-product/bithuman-models RELEASE
      # ASSETS. It holds two SSH DEPLOY KEYS (BITHUMAN_CLI_SSH_KEY,
      # BITHUMAN_MODELS_SSH_KEY) which clone git over ssh — release assets are
      # not in git and are not reachable over ssh — plus this repo's own
      # GITHUB_TOKEN, which is scoped to homebrew-bithuman. So this step needs
      # ONE new secret, BITHUMAN_MODELS_RELEASE_TOKEN: a token with read access
      # to bithuman-models releases. With it, the next tarball ships essence-2.
      # Without it, the tarball is honestly DECLARED essence-2-less rather than
      # silently shipped as one, and this job says so in the log.
      #
      # ★SIZE, so nobody is surprised by it: the resources are 373 MB extracted,
      # 366 MB of which is the shared a2x_w2v.fp32.onnx frontend, plus the
      # 56 MB dylib. A complete tarball is therefore roughly 2x today's 276 MB.
      # That is a real product trade (every `brew install` pays it) and it is
      # the owner's to make — which is another reason this step is opt-in by
      # secret rather than switched on unilaterally.
      - name: Source the essence-2 engine (libessence2) — or declare its absence
        working-directory: cli
        env:
          MODELS_TOKEN: ${{ secrets.BITHUMAN_MODELS_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          E2_REPO=bithuman-product/bithuman-models
          if [ -z "${MODELS_TOKEN:-}" ]; then
            echo "::warning::BITHUMAN_MODELS_RELEASE_TOKEN is not set — this tarball will ship NO essence-2 engine."
            echo "::warning::the command 'bithuman run <X.elevatedir>' will fail on it with: could not load libessence2.dylib"
            echo "::warning::Add a token with read access to $E2_REPO releases to ship the engine."
            echo "BITHUMAN_TARBALL_NO_ESSENCE2=1" >> "$GITHUB_ENV"
            exit 0
          fi
          # ── THE PIN LIVES IN ONE PLACE, AND NOW IT ACTUALLY DOES ────────────
          # ★This block used to carry `E2_TAG=essence2-libessence2-v1.0-a2x`
          # and both sha256s hardcoded, UNDER a comment claiming it read them
          # from the SDK manifest "so a re-pin cannot leave this job fetching
          # the previous engine". It did the exact thing the comment said it
          # did not. A comment describing a property the code lacks is worse
          # than no comment: it tells the next reader not to check.
          #
          # It was inert only because MODELS_TOKEN is unset. The moment the
          # token is armed, the old pin fetches the SUPERSEDED v1.0-a2x engine,
          # the borrow gate below returns rc 3, and the build fails BLAMING THE
          # ENGINE — sending whoever is on it to chase a perfectly good
          # artifact. So the tag and the digests move together, from one source.
          #
          # The owner is models/essence-2/sdk/scripts/bootstrap.sh, on
          # bithuman-models MAIN. ★MAIN, not the essence1-v* tag this job
          # already has checked out for libessence.a: the essence-2 engine pin
          # lives on a DIFFERENT AXIS from the essence-1 ABI tag (the same trap
          # the linux job hit with the LiteRT host). MEASURED 2026-09-02 — at
          # essence1-v2.3.11-win.1 that file reads
          #     LIBESSENCE2_RELEASE=libessence2-v1.0-a2x
          # which is BOTH the superseded engine AND a tag that does not exist
          # (the release is `essence2-libessence2-v1.0-a2x`). The validation
          # below rejects that shape by name rather than 404ing later.
          E2_BS_REF=main
          git clone --filter=blob:none --no-checkout --depth 1 \
              --branch "$E2_BS_REF" "https://github.com/$E2_REPO" e2-pin
          git -C e2-pin sparse-checkout set --no-cone \
              models/essence-2/sdk/scripts/bootstrap.sh
          git -C e2-pin checkout
          E2_BS=e2-pin/models/essence-2/sdk/scripts/bootstrap.sh
          [ -f "$E2_BS" ] || { echo "::error::no $E2_BS on bithuman-models $E2_BS_REF —"; \
            echo "::error::the essence-2 engine pin has no owner to read. Refusing to guess a tag."; exit 1; }
          # Both spellings the file uses: ${VAR-default} and ${VAR:-default}.
          _pin() { sed -nE "s/^$1=\"\\$\\{$1:?-([^}\"]+)\\}\".*/\\1/p" "$E2_BS" | head -1; }
          E2_TAG="$(_pin LIBESSENCE2_RELEASE)"
          E2_SHA_XCF="$(_pin LIBESSENCE2_SHA256)"
          E2_SHA_RES="$(_pin LIBESSENCE2_RESOURCES_SHA256)"
          echo "essence-2 engine pin (from bithuman-models $E2_BS_REF bootstrap.sh):"
          echo "  tag        $E2_TAG"
          echo "  xcframework sha256 $E2_SHA_XCF"
          echo "  resources   sha256 $E2_SHA_RES"
          # A gate that cannot read must refuse, never guess — and an empty or
          # wrong-axis value must not become a download of "whatever exists".
          case "$E2_TAG" in
            essence2-libessence2-v*) ;;
            *) echo "::error::bootstrap.sh yielded E2_TAG='$E2_TAG', which is not an"
               echo "::error::essence2-libessence2-v* release tag. Either the file moved or this"
               echo "::error::checkout is on the wrong axis. Refusing to fetch an unidentified engine."
               exit 1 ;;
          esac
          for v in E2_SHA_XCF E2_SHA_RES; do
            eval "val=\$$v"
            printf '%s' "$val" | grep -Eq '^[0-9a-f]{64}$' \
              || { echo "::error::$v='$val' is not a lowercase sha256 — refusing."; exit 1; }
          done
          mkdir -p e2-src && cd e2-src
          GH_TOKEN="$MODELS_TOKEN" gh release download "$E2_TAG" --repo "$E2_REPO" \
            -p 'libessence2.xcframework.zip' -p 'libessence2-resources.zip' --clobber
          # The pins from bootstrap.sh, checked here so a swapped asset is caught
          # at BUILD time rather than at a customer's first render.
          echo "$E2_SHA_XCF  libessence2.xcframework.zip" | shasum -a 256 -c -
          echo "$E2_SHA_RES  libessence2-resources.zip"   | shasum -a 256 -c -
          # ★onnxruntime.xcframework.zip IS PINNED SEPARATELY, ON PURPOSE, AND
          # IT IS NOT ON THE ENGINE TAG. bootstrap.sh never fetches it (the
          # SwiftPM path links ORT its own way), so the engine release stopped
          # attaching it: MEASURED 2026-09-02, essence2-libessence2-v1.1-tessera
          # carries libessence2.xcframework.zip + libessence2-resources.zip +
          # LIBESSENCE2_PROVENANCE.txt and NO onnxruntime asset, while
          # v1.0-a2x still does. make-libessence2-dylib.sh needs it
          # (ONNXRUNTIME_FW is a hard `:?` require), so a naive tag bump would
          # have failed at `unzip onnxruntime.xcframework.zip` with the engine
          # looking guilty again. It is a third-party runtime on its own axis,
          # so it gets its own declared tag + digest rather than riding the
          # engine's. When a future engine release attaches it again, move this
          # to $E2_TAG and delete this comment.
          E2_ORT_TAG=essence2-libessence2-v1.0-a2x
          E2_ORT_SHA=7d631c161ae0d9c6f01095bcb5556d0b4f0205dc5111e6d2ddae82cc7050a7ed
          GH_TOKEN="$MODELS_TOKEN" gh release download "$E2_ORT_TAG" --repo "$E2_REPO" \
            -p 'onnxruntime.xcframework.zip' --clobber
          echo "$E2_ORT_SHA  onnxruntime.xcframework.zip" | shasum -a 256 -c -
          unzip -oq libessence2.xcframework.zip
          unzip -oq onnxruntime.xcframework.zip
          mkdir -p resources && unzip -oq libessence2-resources.zip -d resources
          # ★THE BORROW GATE, ON THE SLICE, BEFORE ANY OF IT IS BUILT.
          #
          # essence-2's bar is an owner ruling and a switch, not a gradient:
          # teeth are BORROWED from the audio-driven teacher on every lane,
          # with zero synthesis and never a synthesizing fallback.
          #
          # ★THE ENGINE HAS LEARNED TO BORROW, and this comment used to say the
          # opposite. It described v1.0-a2x, which scored tessera_bank 0 /
          # tessera_head 0. The pin above now resolves
          # essence2-libessence2-v1.1-tessera, and MEASURED 2026-09-02 on
          # lafayette against the published bytes (xcframework sha256
          # 7516b0c1…, extracted on real disk — /tmp there is tmpfs and a
          # 733 MB extraction dies mid-unzip, which this gate reports as rc 2,
          # a HOST problem that reads exactly like an ENGINE problem):
          #
          #   v1.1-tessera  macos-arm64          rc 0   bank 6  head 7
          #   v1.1-tessera  ios-arm64            rc 0   bank 6  head 7
          #   v1.1-tessera  ios-arm64-simulator  rc 0   bank 6  head 7
          #   v1.0-a2x      macos-arm64          rc 3   bank 0  head 0  ← control
          #   v1.0-a2x      ios-arm64            rc 3   bank 0  head 0  ← control
          #   (missing file)                     rc 2                   ← control
          #
          # The instrument's own controls fire in BOTH directions on the same
          # archives (be_essence2_create 12; a2x 267/203/201 on the new bytes,
          # 214/174 on the old), so the rc 0 is a measurement, not a gate that
          # stopped looking.
          #
          # cli/scripts/bundle-macos.sh runs the same refusal (that is the
          # load-bearing gate, one step before the copy that would make it part
          # of the tarball). This runs the SAME check here so a failure is
          # attributed to the engine at the moment it is fetched, instead of
          # forty minutes later inside an assembly step — and so the reason
          # lands next to the secret whose arrival caused it.
          #
          # ★IT IS STILL LOAD-BEARING. Keep it: it is what stops a future
          # re-pin, or a hand-set E2_TAG, from walking a synthesizing engine
          # back into the tarball. Nothing about a green today licenses
          # deleting it.
          # `cli_ref` is a dispatch input, so it can name a ref that predates
          # the gate. "The gate file is absent" and "the engine is fine" must
          # never look the same from here.
          if [ ! -f ../scripts/check-libessence2-borrows.sh ]; then
            echo "::error::cli_ref '${{ inputs.cli_ref }}' has no scripts/check-libessence2-borrows.sh."
            echo "::error::Refusing to vendor an essence-2 engine no gate has read. Build from a cli_ref"
            echo "::error::at or after bithuman-product/bithuman 60195fe, or unset"
            echo "::error::BITHUMAN_MODELS_RELEASE_TOKEN to ship a tarball without essence-2."
            exit 1
          fi
          bash ../scripts/check-libessence2-borrows.sh \
            "$PWD/libessence2.xcframework/macos-arm64/libessence2.a" || {
              rc=$?
              echo "::error::REFUSING to build a macOS tarball around this essence-2 engine (gate rc=$rc)."
              echo "::error::rc=3 it SYNTHESIZES teeth — it never references the frozen donor-bank members."
              echo "::error::rc=2 it could not be inspected — a gate that cannot read must not guess."
              echo "::error::Fix the ENGINE (bithuman-models models/essence-2: port the TESSERA TeethPass"
              echo "::error::into the CoreML/ANE core and cut a new pinned release), then re-run. To ship a"
              echo "::error::tarball WITHOUT essence-2 in the meantime, unset BITHUMAN_MODELS_RELEASE_TOKEN."
              exit "$rc"; }
          LIBESSENCE2_A="$PWD/libessence2.xcframework/macos-arm64/libessence2.a" \
          ONNXRUNTIME_FW="$PWD/onnxruntime.xcframework/macos-arm64_x86_64" \
          OUT="$PWD/libessence2.dylib" \
            bash ../scripts/make-libessence2-dylib.sh
          echo "LIBESSENCE2_DYLIB=$PWD/libessence2.dylib" >> "$GITHUB_ENV"
          echo "LIBESSENCE2_RESOURCES=$PWD/resources" >> "$GITHUB_ENV"

      - name: Assemble tarball (bundle-macos.sh vendors engine + dylibs) + no-dup gate
        working-directory: cli
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"; rm -rf "$STAGE"; mkdir -p "$STAGE/engines"
          cp target/release/bithuman "$STAGE/bithuman"
          # LIBESSENCE2_* are set by the step above only when the engine was
          # sourced; bundle-macos.sh treats unset as "no essence-2" and its
          # pairing gate then REFUSES the build unless
          # BITHUMAN_TARBALL_NO_ESSENCE2=1 declares that on purpose (which the
          # step above sets when the token is missing). Forgetting them can no
          # longer produce a silently essence-2-less tarball.
          EXPRESSION2_MODEL_BIN="$PWD/engine-src/expression2-model" \
          EMBODY_MODEL="$PWD/engine-src/embody.model" \
          LIBESSENCE2_DYLIB="${LIBESSENCE2_DYLIB:-}" \
          LIBESSENCE2_RESOURCES="${LIBESSENCE2_RESOURCES:-}" \
          BITHUMAN_TARBALL_NO_ESSENCE2="${BITHUMAN_TARBALL_NO_ESSENCE2:-0}" \
            bash scripts/bundle-macos.sh "$STAGE/bithuman"
          cp "engine-src/mac-arm64-$ENGINE_VERSION.engine" "$STAGE/engines/"
          BIN_DIR="$STAGE" bash scripts/check-engine-dedup.sh      # DISTRIBUTION.md §13
          # The tarball is NOT built here any more. $STAGE must be Developer ID
          # signed and notarized FIRST -- signing rewrites every Mach-O in place,
          # so a tarball rolled before signing would ship the ad-hoc bytes.
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      # ────────────────────────────────────────────────────────────────
      # Developer ID signing + notarization.
      #
      # Every mac `bithuman` up to and including cli-v2.4.2 shipped AD-HOC
      # signed -- `Signature=adhoc`, `TeamIdentifier=not set`, and
      # `spctl -a -t install` = rejected. bitHuman has held the
      # `Developer ID Application: bitHuman Inc. (G64NFNZX84)` certificate the
      # whole time and never used it.
      #
      # Measured on alpharetta (macOS 26.6.2, Gatekeeper + SIP on) against the
      # exact cli-v2.4.2 tarball this workflow published, sha256 49582d8ced9c78c9:
      #
      #   published tarball, quarantined as a browser download:
      #     codesign -dv      -> flags=0x2(adhoc), TeamIdentifier=not set
      #     spctl -t install  -> rejected
      #     ./bithuman --version -> rc=137   (SIGKILL, no message)
      #
      #   same tree, signed + notarized by these steps:
      #     codesign -dv      -> Authority=Developer ID Application: bitHuman Inc.
      #                          (G64NFNZX84), flags=0x10000(runtime)
      #     spctl -t install  -> accepted, source=Notarized Developer ID
      #     ./bithuman --version -> rc=0
      #
      # ★ Quarantine is what makes this matter, and it is also why almost nobody
      # has hit it: Homebrew fetches with curl, which sets no quarantine
      # attribute, so `brew install` users run the ad-hoc binary happily.
      # A browser download of the same tarball is quarantined, macOS propagates
      # that onto every extracted member (plain `tar -xzf` does it too, not just
      # Archive Utility), and the binary is then killed on exec.
      - name: Import the Developer ID signing certificate
        id: signing_cert
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_P12_PASSWORD: ${{ secrets.MACOS_CERT_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_CERT_P12_PASSWORD:-}" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::MACOS_CERT_P12_BASE64 / MACOS_CERT_P12_PASSWORD not set — cannot sign"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          # Ephemeral keychain password: it guards a keychain that exists only
          # for this job and is deleted below. It is not a durable secret.
          KPW="$(uuidgen)"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          P12="$RUNNER_TEMP/cert.p12"
          printf '%s' "$MACOS_CERT_P12_BASE64" | base64 --decode > "$P12"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_CERT_P12_PASSWORD" \
                  -T /usr/bin/codesign -f pkcs12
          rm -f "$P12"
          # Without this, codesign blocks on a UI prompt that never comes and
          # the job hangs until the timeout.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
                  -s -k "$KPW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "MACOS_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          IDENT="$(security find-identity -v -p codesigning "$KEYCHAIN" \
                   | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          [ -n "$IDENT" ] || { echo "::error::no Developer ID Application identity in the imported .p12"; exit 1; }
          echo "imported identity: $IDENT"
          echo "MACOS_SIGN_IDENTITY=$IDENT" >> "$GITHUB_ENV"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Sign every Mach-O with the Developer ID (hardened runtime)
        if: steps.signing_cert.outputs.available == 'true'
        run: bash tap/scripts/sign-macos.sh "$STAGE"

      - name: Notarize with Apple
        id: notarize
        if: steps.signing_cert.outputs.available == 'true'
        env:
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "${NOTARY_KEY_P8_BASE64:-}" ] && [ -n "${NOTARY_KEY_ID:-}" ] && [ -n "${NOTARY_ISSUER:-}" ]; then
            KEY="$RUNNER_TEMP/notary.p8"
            printf '%s' "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$KEY"
            trap 'rm -f "$KEY"' EXIT
            NOTARY_KEY="$KEY" bash tap/scripts/notarize-macos.sh "$STAGE"
          elif [ -n "${NOTARY_APPLE_ID:-}" ] && [ -n "${NOTARY_TEAM_ID:-}" ] && [ -n "${NOTARY_PASSWORD:-}" ]; then
            bash tap/scripts/notarize-macos.sh "$STAGE"
          else
            echo "notarized=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no notarization credentials — signed but NOT notarized; Gatekeeper still rejects"
            exit 0
          fi
          echo "notarized=true" >> "$GITHUB_OUTPUT"

      - name: Refuse to publish an unsigned or unnotarized tarball
        run: |
          set -euo pipefail
          SIGNED='${{ steps.signing_cert.outputs.available }}'
          NOTARIZED='${{ steps.notarize.outputs.notarized }}'
          if [ "$SIGNED" = "true" ] && [ "$NOTARIZED" = "true" ]; then
            echo "signed + notarized — ok to publish"; exit 0
          fi
          # Mirrors the BITHUMAN_TARBALL_NO_ESSENCE2 pattern: shipping a
          # degraded artifact has to be DECLARED, never a silent default.
          if [ '${{ inputs.allow_unsigned }}' = 'true' ]; then
            echo "::warning::publishing an ad-hoc / unnotarized tarball because allow_unsigned=true"
            exit 0
          fi
          cat >&2 <<'EOF'
          ::error::refusing to publish a Gatekeeper-rejected mac tarball.

          This job will not repeat the cli-v2.4.2 defect (Signature=adhoc,
          spctl rejected, SIGKILL on a quarantined download) by default.

          Add these repo secrets on bithuman-product/homebrew-bithuman:
            MACOS_CERT_P12_BASE64    base64 of the "Developer ID Application:
                                     bitHuman Inc. (G64NFNZX84)" identity
                                     exported as .p12 WITH its private key
            MACOS_CERT_P12_PASSWORD  the .p12 export password
          and ONE notarization credential:
            NOTARY_KEY_P8_BASE64 + NOTARY_KEY_ID + NOTARY_ISSUER   (preferred)
              -- App Store Connect API key; NOTARY_ISSUER is the UUID from
                 App Store Connect > Users and Access > Integrations.
            NOTARY_APPLE_ID + NOTARY_TEAM_ID + NOTARY_PASSWORD
              -- Apple ID + an app-specific password. NOTARY_TEAM_ID=G64NFNZX84.

          To publish anyway, re-dispatch with allow_unsigned=true.
          EOF
          exit 1

      - name: Roll the tarball from the SIGNED stage
        run: |
          set -euo pipefail
          TGZ="$RUNNER_TEMP/bithuman-aarch64-apple-darwin.tar.gz"
          # ★THE FILE LIST USED TO BE HAND-WRITTEN: `tar ... bithuman lib
          # expression2-model embody.model engines`. That list is a SECOND
          # place a vendored file can be dropped, silently and after every
          # gate has passed — libessence2.dylib and the essence-2 resource
          # bundles are vendored into $STAGE by bundle-macos.sh and would have
          # been left on the floor by this line even once everything upstream
          # was correct. Archive what the staging directory actually CONTAINS,
          # so vendoring and shipping cannot diverge again.
          ( cd "$STAGE" && COPYFILE_DISABLE=1 tar --no-xattrs --exclude '._*' \
              -czf "$TGZ" . )
          # Say what shipped, in the log, at the size it shipped — the cheapest
          # possible check on "did the engine make it in".
          echo "tarball contents (top level):"
          tar tzf "$TGZ" | sed 's|^\./||' | awk -F/ 'NF<=1 && $0!=""' | sort -u
          if tar tzf "$TGZ" | grep -q 'libessence2\.dylib'; then
            echo "::notice::this tarball VENDORS the essence-2 engine"
          else
            echo "::warning::this tarball ships NO essence-2 engine (declared)"
          fi
          shasum -a 256 "$TGZ" | tee "$TGZ.sha256"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      # The acceptance test, run on the bytes about to be uploaded and in the
      # state a customer actually receives them in: QUARANTINED. An
      # un-quarantined check would pass on an ad-hoc binary and prove nothing —
      # that is exactly how this defect survived every release to date.
      - name: Verify the tarball the way a customer receives it (quarantined)
        if: steps.notarize.outputs.notarized == 'true'
        run: bash tap/scripts/verify-macos-release.sh "$TGZ"

      - name: Upload tarball to the release + emit formula sha
        env:
          OVERWRITE_PUBLISHED: ${{ inputs.overwrite_published }}
        run: |
          set -euo pipefail
          # NOT a bare `--clobber`: replacing an asset customers are already
          # installing has to be declared. See scripts/upload-release-asset.sh.
          bash tap/scripts/upload-release-asset.sh "$RELEASE_TAG" "$TGZ" "$TGZ.sha256"
          echo "::notice::Formula sha256 for cli $RELEASE_TAG = $(cut -d' ' -f1 "$TGZ.sha256")"

      - name: Remove the temporary signing keychain
        if: always()
        run: |
          if [ -n "${MACOS_KEYCHAIN:-}" ] && [ -f "$MACOS_KEYCHAIN" ]; then
            security delete-keychain "$MACOS_KEYCHAIN" || true
          fi

  # ──────────────────────────────────────────────────────────────────
  # Linux x86_64 lane — the analogue of mac-tarball, so `bithuman run` renders
  # Wise Pup out of the box on Linux with a ZERO-fetch embedded engine (the gap
  # cli-v2.4.0's first cut had: the tarball shipped the binary but no render
  # host). The LiteRT host is a BUILT artifact (unlike the mac Swift tool), so
  # this job builds it in-workflow from the bithuman-models source rather than
  # pulling a secret URL — fully reproducible from public + deploy-key inputs.
  #   1. cross-compile `bithuman` in the pinned manylinux_2_28 image (glibc 2.28),
  #   2. build `expression2-model` = PyInstaller --onefile of the #278 split host
  #      (render_stream_host_litert.py) + pinned ai_edge_litert/numpy, on Ubuntu
  #      22.04 (glibc 2.35 → Ubuntu 22.04+/Debian 12+/RHEL 9+),
  #   3. fetch the sha-pinned linux-x64-<ver>.engine (PUBLIC url from imx_fetch.rs),
  #   4. build-linux.sh vendors host + engine + runs BOTH gates (no-dup +
  #      host↔engine render compatibility) + tars {bithuman,lib,expression2-model,
  #      engines}, then uploads.
  linux-tarball:
    name: Linux x86_64 self-contained CLI tarball (host + engine vendored)
    # ★GATED. This job used to run on EVERY dispatch and end in an unguarded
    # `gh release upload --clobber`, while the mac job beside it correctly
    # refused to publish. So a dispatch made only to exercise the mac signing
    # path would still rebuild the Linux tarball and REPLACE the published
    # asset for whatever release_tag was passed -- silently, and against a tag
    # the Homebrew formula pins a sha256 for. Two independent brakes now: this
    # `if`, and scripts/upload-release-asset.sh refusing an existing asset.
    if: inputs.build_linux
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLI_REF: ${{ inputs.cli_ref }}
      ENGINE_VERSION: ${{ inputs.engine_version }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Checkout bithuman (private CLI repo — needs the deploy key)
        uses: actions/checkout@v4
        with:
          repository: bithuman-product/bithuman
          ref: ${{ inputs.cli_ref }}
          path: cli
          # bithuman-product/bithuman is PRIVATE; this repo's default
          # GITHUB_TOKEN cannot read it (the exact first-run failure of
          # 2026-08-01). Read-only deploy key on the bithuman repo.
          ssh-key: ${{ secrets.BITHUMAN_CLI_SSH_KEY }}

      - name: Checkout this tap (scripts/upload-release-asset.sh)
        uses: actions/checkout@v4
        with:
          path: tap

      - name: Load the bithuman-models deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.BITHUMAN_MODELS_SSH_KEY }}

      - name: Configure git auth for private bithuman-models
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Clone bithuman-models (engine src + manylinux Dockerfile + LiteRT host src)
        run: |
          set -euo pipefail
          TAG=$(grep -m1 'tag = "essence1-' cli/Cargo.toml | sed -E 's/.*tag = "([^"]+)".*/\1/')
          echo "engine tag: $TAG"
          git clone --depth 1 --branch "$TAG" \
              https://github.com/bithuman-product/bithuman-models bithuman-models
          echo "BM=$PWD/bithuman-models" >> "$GITHUB_ENV"
          # The LiteRT render host lives on a DIFFERENT axis than the essence-1
          # ABI tag: models/expression-2/engine/cpu/serve/render_stream_host_litert.py
          # does not exist at essence1-v* tags (proven: first dispatch died at
          # `test -f $HOSTSRC`, 2026-08-01 run 30715617689). Host source comes
          # from bithuman-models MAIN; the host↔engine render-compat gate in
          # build-linux.sh still validates the pairing against the pinned engine.
          git clone --depth 1 \
              https://github.com/bithuman-product/bithuman-models bithuman-models-main
          echo "BM_MAIN=$PWD/bithuman-models-main" >> "$GITHUB_ENV"

      - name: Build the pinned manylinux_2_28 image (the `bithuman` glibc 2.28 floor)
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            -t libessence/manylinux-x86_64:0.1 \
            -f "$BM/models/essence-1/sdk/python/scripts/Dockerfile.manylinux-x86_64" \
            "$BM/models/essence-1/sdk/python/scripts"

      - name: Build the LiteRT render host (expression2-model, glibc 2.35 floor)
        run: |
          set -euo pipefail
          HOSTSRC="$BM_MAIN/models/expression-2/engine/cpu/serve/render_stream_host_litert.py"
          test -f "$HOSTSRC"   # the #278 two-interpreter split host (main-axis, see clone step)
          mkdir -p host-build && cp "$HOSTSRC" host-build/
          # ★tools/shared_enc_dep.py MUST travel with the host, and the host says
          # so itself. It is the ONE place the shared-encoder BASE policy lives:
          # the two-artifact LiteRT split pairs an identity.tflite against a
          # shared-enc.tflite, and pairing the wrong pair "loaded without error
          # and rendered 181 frames, 0 of 181 matching the correct render" --
          # silently wrong pixels, no exception. So when the module is absent the
          # host REFUSES the split path by name rather than falling back to the
          # old unchecked pairing.
          #
          # It lives in models/expression-2/tools/, NOT beside the host source in
          # engine/cpu/serve/, so `cp "$HOSTSRC"` alone left it behind and the
          # frozen host could never import it: at runtime under --onefile,
          # os.path.dirname(__file__) is PyInstaller's extraction dir, so neither
          # of the host's two search paths (the repo tools/ dir; beside this file)
          # can resolve outside the bundle. MEASURED on run 33602563547, the
          # host↔engine gate in build-linux.sh:
          #   FATAL: ... is a two-artifact split, but this engine has no
          #   shared_enc_dep.py ... (No module named 'shared_enc_dep')
          #   host-engine gate: host exited before READY (rc=3)
          # That is the gate working. The fix is to FREEZE the module in, from the
          # SAME tree the host came from so producer and consumer cannot drift.
          # It is stdlib-only (hashlib/os/re), so it adds no dependency, and it can
          # only make the pairing check STRICTER -- never vacuous: with the module
          # absent the split path refuses, with it present the declared base sha is
          # actually verified.
          SEDSRC="$BM_MAIN/models/expression-2/tools/shared_enc_dep.py"
          test -f "$SEDSRC"
          cp "$SEDSRC" host-build/
          docker run --rm --platform linux/amd64 -v "$PWD/host-build":/work ubuntu:22.04 bash -c '
            set -e; export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq && apt-get install -y -qq python3 python3-venv python3-pip binutils >/dev/null
            cd /work && python3 -m venv v && ./v/bin/pip -q install --upgrade pip wheel
            ./v/bin/pip -q install "ai_edge_litert==2.1.6" "numpy==2.2.6" "pyinstaller==6.21.0"
            ./v/bin/pyinstaller --onefile --name expression2-model --distpath d --workpath b \
              --paths /work --hidden-import shared_enc_dep \
              --collect-all ai_edge_litert --collect-submodules numpy --console render_stream_host_litert.py'
          test -f host-build/d/expression2-model
          # ★ASSERT THE MODULE IS ACTUALLY FROZEN IN. An unresolvable
          # `--hidden-import` is a WARNING in PyInstaller, not a build error, so
          # without this a future build could go green for the old reason.
          #
          # It has to be PYZ-00.toc, and that is a measured claim, not a guess.
          # Two controls, built for real with PyInstaller 6.21.0:
          #   module file present -> PYZ-00.toc names it 1x, Analysis-00.toc 3x
          #   module file ABSENT  -> PYZ-00.toc names it 0x, Analysis-00.toc 1x
          # So Analysis-00.toc is NON-ZERO IN BOTH -- it records the attempted
          # import whether or not it resolved, and a guard reading it is blind to
          # exactly the failure it exists to catch. Only PYZ-00.toc, the frozen
          # module archive's index, discriminates.
          # A raw grep of the onefile BINARY is also blind (measured: 0 hits even
          # on a working build -- the PYZ payload is compressed).
          PYZ="$(find host-build/b -name 'PYZ-*.toc' | head -1)"
          [ -n "$PYZ" ] || { echo "::error::no PYZ toc under host-build/b -- cannot verify the freeze"; exit 1; }
          grep -q "'shared_enc_dep'" "$PYZ" \
            || { echo "::error::shared_enc_dep is NOT frozen into expression2-model ($PYZ)."; \
                 echo "::error::The host would refuse every two-artifact split identity at render time."; exit 1; }
          echo "shared_enc_dep frozen into the host (verified in $PYZ): OK"
          echo "HOST=$PWD/host-build/d/expression2-model" >> "$GITHUB_ENV"

      - name: Source the vendored engine + probe imx (PUBLIC pins from the CLI source)
        working-directory: cli
        run: |
          set -euo pipefail
          ENG_URL=$(grep -o 'https://[^"]*linux-x64-'"$ENGINE_VERSION"'\.engine' \
                    crates/bithuman-cli/src/expression2/imx_fetch.rs | head -1)
          echo "engine url: $ENG_URL"
          curl -fsSL -o "$RUNNER_TEMP/linux-x64-$ENGINE_VERSION.engine" "$ENG_URL"
          echo "EXPRESSION2_ENGINE_FILE=$RUNNER_TEMP/linux-x64-$ENGINE_VERSION.engine" >> "$GITHUB_ENV"
          IMX_URL=$(grep -o 'https://[^"]*wise-pup\.imx' crates/bithuman-cli/src/cmd/models.rs | head -1)
          curl -fsSL -o "$RUNNER_TEMP/probe.imx" "$IMX_URL"
          echo "EXPRESSION2_PROBE_IMX=$RUNNER_TEMP/probe.imx" >> "$GITHUB_ENV"
          # ★KNOWN BLOCKER, AND IT IS IN THE PROBE ARTIFACT, NOT IN THIS JOB.
          # The gate below (gate 2, host<->engine) currently REFUSES this probe:
          #
          #   FATAL: probe.imx carries identity.tflite (the two-artifact split's
          #   DELTA half) and declares no 'expr2-shared-enc' base in its manifest
          #   dependencies[], and carries no shared-enc.tflite of its own. There is
          #   no way to tell which shared-enc.tflite it was cut against, and the
          #   wrong one renders a DIFFERENT FACE with no error (measured
          #   2026-09-01: 181 of 181 frames wrong, silently). Re-emit the container
          #   with tools/imx_from_bundle.py, which stamps the base content address.
          #
          # CONFIRMED ON THE PUBLISHED BYTES, independently of CI, with the shipped
          # cli-v2.5.0 `bithuman info --json` (2026-09-02): wise-pup.imx sha256
          # d677173de4a4025b…, 89,354,265 B, family expression-2, IMX v2, 14
          # members -- carries identity.tflite, carries NO shared-enc.tflite, and
          # its manifest has no dependencies[] at all (null). So the refusal is a
          # true statement about the artifact.
          #
          # THE FIX IS NOT HERE. wise-pup.imx is the PUBLISHED showcase avatar that
          # `bithuman pull wise-pup` hands customers; re-emitting it is an
          # expression-2 artifact-publishing action, and replacing bytes customers
          # already have is exactly the hazard scripts/upload-release-asset.sh
          # exists to stop being done casually. Owner action: re-emit wise-pup.imx
          # through tools/imx_from_bundle.py so it stamps its base content address,
          # then re-dispatch this workflow with build_linux=true.
          #
          # ★CORRECTED 2026-09-02: "UNTIL THEN NO LINUX TARBALL IS PUBLISHED"
          # was true of THIS JOB and was read as true of the RELEASE. It was not.
          # cli-v2.5.0 shipped macOS-only and every Linux customer running the
          # documented `curl … install.sh | sh` got a 404 and rc=1 (reproduced
          # on lafayette before anything was changed). A blocked build job is
          # not a neutral state when the installer resolves the newest cli-v*
          # tag; see the verify-release-coverage job at the end of this file,
          # which now makes that failure LOUD instead of leaving it to a
          # customer to discover.
          #
          # cli-v2.5.0's Linux tarball WAS published (2026-09-02T11:55Z,
          # sha256 439d8222…): the 2.5.0 `bithuman` binary built from this same
          # cli main (`--model` + the disclosure-header path), vendoring the
          # expression2-model host and linux-x64-1.0.0.engine BYTE-IDENTICAL to
          # the ones cli-v2.4.2 already ships (host sha256 2270798418b0462b…,
          # engine 4ad3ce614be572e2… = the imx_fetch.rs pin). Both gates were
          # run on those exact bytes and passed: no-dup, and host↔engine
          # rendered 85 frames from wise-pup.imx.
          #
          # ★THE FRESHLY-BUILT HOST IS STILL BLOCKED, and deliberately was not
          # shipped. The host this job builds now freezes in shared_enc_dep.py,
          # and with it present the host REFUSES wise-pup.imx at load
          # (sys.exit(3)) because that container declares no shared-enc base.
          # That is not only a gate problem: shipping that host would make
          # `bithuman run` — the out-of-box showcase — fail for every Linux
          # customer. So the 2.5.0 tarball carries the host cli-v2.4.2 already
          # shipped, unchanged, and this job stays red until the OWNER ACTION
          # above (re-emit wise-pup.imx through tools/imx_from_bundle.py so it
          # stamps its base content address) lands. cli-v2.4.2's assets were
          # NOT touched: the publish used scripts/upload-release-asset.sh
          # against cli-v2.5.0, which can only address the tag it is given and
          # refuses a name that already exists.

      - name: Build + vendor + gate the linux tarball (scripts/build-linux.sh)
        working-directory: cli
        env:
          EXPRESSION2_MODEL_BIN: ${{ env.HOST }}
          # EXPRESSION2_ENGINE_FILE + EXPRESSION2_PROBE_IMX exported above; keep
          # the compose tree on the workspace FS so cp -al hardlinks work.
          BITHUMAN_CLI_COMPOSE_DIR: ${{ github.workspace }}/compose-cli-linux
        run: |
          set -euo pipefail
          # x86_64: manylinux cross-compile of `bithuman`, then _vendor_expr2_linux
          # stages expression2-model + engines/linux-x64-<ver>.engine, runs the
          # no-dup + host↔engine gates, and tars the self-contained bundle.
          BITHUMAN_SDK_ROOT="$BM/models/essence-1" bash scripts/build-linux.sh x86_64
          TGZ="$PWD/dist/bithuman-x86_64-unknown-linux-gnu.tar.gz"
          test -f "$TGZ"
          echo "TGZ=$TGZ" >> "$GITHUB_ENV"

      - name: Upload linux tarball to the release + emit sha
        env:
          OVERWRITE_PUBLISHED: ${{ inputs.overwrite_published }}
        run: |
          set -euo pipefail
          # NOT a bare `--clobber` — this is the exact line that made an
          # unrelated mac-lane dispatch able to replace the published Linux
          # tarball. See scripts/upload-release-asset.sh.
          bash tap/scripts/upload-release-asset.sh "$RELEASE_TAG" "$TGZ" "$TGZ.sha256"
          echo "::notice::Linux tarball sha256 for cli $RELEASE_TAG = $(cut -d' ' -f1 "$TGZ.sha256")"

  # ──────────────────────────────────────────────────────────────────
  # Coverage gate: a release that publishes SOME platforms and not others must
  # go RED, not ship silently.
  #
  # ★THIS IS THE INSTANCE THAT MADE IT NECESSARY. `linux-tarball` above was
  # gated behind `inputs.build_linux` — correctly, because ungated it ended in
  # an unguarded `gh release upload --clobber` that could replace a published
  # Linux asset for whatever tag was passed. One hazard closed, another opened:
  # cli-v2.5.0 was dispatched build_linux=false, shipped macOS-only, and the run
  # went GREEN. Every Linux customer running the documented one-liner then got
  #
  #   curl: (22) The requested URL returned error: 404   -> install.sh rc=1
  #
  # because install.sh resolves the newest `cli-v*` tag and finds no
  # bithuman-x86_64-unknown-linux-gnu.tar.gz on it. Nothing anywhere compared
  # what the release CARRIES against what the release before it HAD.
  #
  # `needs` both build jobs with `if: !cancelled()` so this runs even when one
  # of them was SKIPPED — the skip is precisely the condition it exists to
  # catch. It reads the LIVE releases index (not this run's artifacts): the
  # artifacts cannot see a platform that was never built in this run, and the
  # customer downloads from the release, not from an artifact.
  #
  # Shape mirrors bithuman-models' verify-wheel-coverage / tools/
  # verify_pypi_platform_coverage.py, down to the "prove the gate fires before
  # trusting its green" self-test step.
  verify-release-coverage:
    name: Verify release platform coverage
    needs: [mac-tarball, linux-tarball]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout this tap (tools/verify_release_platform_coverage.py)
        uses: actions/checkout@v4

      - name: Prove the gate FIRES before trusting its green (mutation control)
        # In-process refusal arms + opposite-direction controls. Never re-execs
        # itself — a positive control that re-runs itself unmutated is a fork
        # bomb, and one of those OOM-stormed lafayette on 2026-09-01.
        run: python3 tools/verify_release_platform_coverage.py --self-test

      - name: The release must not drop a platform its predecessor had
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          # The Releases API can lag a few seconds behind an upload; retry a
          # handful of times before believing an asset is absent. rc=2 means
          # the index was UNREADABLE — never treated as green.
          rc=1
          for i in 1 2 3 4 5 6; do
            set +e
            python3 tools/verify_release_platform_coverage.py --tag "$RELEASE_TAG"
            rc=$?
            set -e
            [ "$rc" -eq 0 ] && break
            echo "attempt $i: coverage gate rc=$rc; re-reading the index in 20 s…"
            sleep 20
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::PARTIAL RELEASE — $RELEASE_TAG does not carry every"
            echo "::error::platform its predecessor did (gate rc=$rc). Re-dispatch"
            echo "::error::release-cli with the missing platform's build_* input"
            echo "::error::ON, or delete the tag. Do NOT leave it published:"
            echo "::error::\`curl -sSL install.bithuman.ai | sh\` resolves the"
            echo "::error::newest cli-v* tag and 404s on the missing platform."
            exit "$rc"
          fi
