# flutter-plugin-tests — packages/flutter-plugin/test/ runs on EVERY push and PR that
# touches the plugin. avatar_fit_test.dart is the fill rule the owner accepted on his
# phone (#41); essence2_catalog_test.dart guards the catalog read. Until this workflow
# existed no homebrew workflow ran `flutter test` at all (preflight.yml verifies repo
# layout; plugin-platform-guards.yml grades Swift #if reasons), so those tests ran only
# when a human ran them — a memory, not a gate.
#
# ★A GATE MUST BE ABLE TO SAY "I COULD NOT LOOK": the test census runs first and refuses
# an empty set. NOT a publish trigger: publish-pubdev.yml listens to tags flutter-v*;
# this file listens to pushes and PRs and uploads nothing.
name: flutter plugin tests

on:
  push:
    branches: [main]
    paths: ['packages/flutter-plugin/**', '.github/workflows/flutter-plugin-tests.yml']
  pull_request:
    paths: ['packages/flutter-plugin/**', '.github/workflows/flutter-plugin-tests.yml']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  plugin:
    name: packages/flutter-plugin — flutter test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/flutter-plugin
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: toolchain
        run: flutter --version
      - name: the test census is non-empty (a gate that can say it could not look)
        run: |
          set -euo pipefail
          N=$(ls test/*_test.dart 2>/dev/null | wc -l | tr -d ' ')
          echo "test files: $N"; ls test/*_test.dart
          [ "$N" -ge 1 ] || { echo "::error::no *_test.dart under packages/flutter-plugin/test — nothing was graded"; exit 1; }
      # ★THE FORMAT RATCHET — a re-add is caught HERE, on every push, not at
      # publish time. The publish door in publish-pubdev.yml is the refusal
      # that matters, but it only runs on a `flutter-v*` tag, so on its own a
      # new copy could sit in the tree for months before anyone saw it.
      #
      # OWNER RULING 2026-09-16: bitHuman's on-device container format is
      # proprietary and stays in a private repo. This repository is PUBLIC and
      # pub.dev would publish `lib/` AS SOURCE.
      #
      # ★A RATCHET, NOT A CLIFF. One reader exists today and its removal needs
      # an engine-side unpack entry point (see the note above it in
      # lib/bithuman.dart) — so the count is baselined and may only SHRINK. A
      # SECOND file gaining one is refused by name. It screens for OUR OWN
      # symbol, never for the layout: naming the format here to detect the
      # format would be the disclosure it prevents.
      - name: no NEW file parses the avatar container
        run: |
          set -euo pipefail
          BASELINE=1
          N=$(grep -rl "_unpackImxContainer" lib/ 2>/dev/null | wc -l | tr -d " ")
          echo "files parsing the container in lib/: $N (baseline $BASELINE)"
          grep -rl "_unpackImxContainer" lib/ 2>/dev/null || true
          if [ "$N" -gt "$BASELINE" ]; then
            echo "::error::a NEW file parses the proprietary avatar container. This is a RATCHET: the one reader that exists today is expected and baselined, a SECOND one is not. The one implementation belongs in the engine's compiled bytes, not in this public repo — and not rewritten into ios/Classes or shared/Classes, which are in it too. Do not raise BASELINE to make this pass."
            exit 1
          fi
          if [ "$N" -lt "$BASELINE" ]; then
            echo "::notice::the container reader is gone from $((BASELINE - N)) file(s) — lower BASELINE to $N in this step and in publish-pubdev.yml's preflight."
          fi

      - name: flutter pub get
        run: flutter pub get
      - name: flutter test
        run: flutter test --reporter expanded
