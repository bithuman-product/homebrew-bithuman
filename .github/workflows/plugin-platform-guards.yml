# A bare `#if os(macOS)` in the umbrella plugin's SHARED sources compiles the block
# OUT on iPhone, silently. Three shipping defects came from exactly that — an agent
# dir that could not load, a turn-end flush that never ran (last word clipped, picture
# frozen 3 s), and a barge that did not reset the engine — and all three were found by
# accident, not by a gate. This is the gate.
name: plugin platform guards

on:
  pull_request:
    paths:
      - 'packages/flutter-plugin/shared/Classes/**'
      - 'packages/flutter-plugin/ios/Classes/**'
      - 'packages/flutter-plugin/macos/Classes/**'
      - 'packages/flutter-plugin/lib/**'
      - 'packages/flutter-plugin/android/src/**'
      - 'packages/flutter-plugin/android/build.gradle'
      - 'scripts/check_android_coordinates_on_central.sh'
      - 'scripts/pom_dependencies.py'
      - 'scripts/check_platform_guards.sh'
      - 'scripts/check_dev_levers.sh'
      - 'scripts/prove_dev_levers_release.sh'
      - 'scripts/check_voice_render_edge.sh'
      - 'scripts/prove_lipsync_sink_headless.sh'
      - 'scripts/check_voice_render_edge_dart.sh'
      - 'scripts/ci/mutate_voice_render_edge_dart.py'
      - '.github/workflows/plugin-platform-guards.yml'
  push:
    branches: [main]
    paths:
      - 'packages/flutter-plugin/shared/Classes/**'
      - 'packages/flutter-plugin/ios/Classes/**'
      - 'packages/flutter-plugin/macos/Classes/**'
      - 'packages/flutter-plugin/lib/**'
      - 'packages/flutter-plugin/android/src/**'
      - 'packages/flutter-plugin/android/build.gradle'
      - 'scripts/check_android_coordinates_on_central.sh'
      - 'scripts/pom_dependencies.py'
      - 'scripts/check_platform_guards.sh'
      - 'scripts/check_dev_levers.sh'
      - 'scripts/prove_dev_levers_release.sh'
      - 'scripts/check_voice_render_edge.sh'
      - 'scripts/prove_lipsync_sink_headless.sh'
      - 'scripts/check_voice_render_edge_dart.sh'
      - 'scripts/ci/mutate_voice_render_edge_dart.py'
      - '.github/workflows/plugin-platform-guards.yml'
  workflow_dispatch:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every bare '#if os(macOS)' in shared sources states its reason
        run: ./scripts/check_platform_guards.sh
      - name: Negative control — the check must FAIL when a reason is removed
        run: |
          # A check that cannot fail is not a check. Strip one reason, require rc=1,
          # then put it back and require rc=0.
          F=packages/flutter-plugin/shared/Classes/DeviceIdentity.swift
          cp "$F" /tmp/guard.bak
          sed -i '/macOS-only/d' "$F"
          if ./scripts/check_platform_guards.sh > /dev/null 2>&1; then
            echo "::error::the guard check PASSED with a reason removed — it is not looking"
            cp /tmp/guard.bak "$F"; exit 1
          fi
          cp /tmp/guard.bak "$F"
          ./scripts/check_platform_guards.sh

  # ── "RESOLVES FROM CENTRAL ALONE": the claim, graded against the registry ────────────
  # 2026-09-22: the Android header told every reader that expression-2 "needs google()
  # beside mavenCentral(): its LiteRT dependency lives on Google's Maven only." True at
  # 0.3.0. Dead from 0.3.1 — three minors and six months before anyone noticed, because
  # nothing graded it. A prose claim about a registry belongs to the registry.
  android-coordinates-on-central:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: every pinned coordinate and every transitive dep is on Maven Central
        run: ./scripts/check_android_coordinates_on_central.sh
      - name: Positive control from history — the 0.3.0 pin MUST go red on litert
        run: |
          set -u
          # Not a synthetic mutant: the exact pin whose transitive
          # com.google.ai.edge.litert:litert (404 on Central) made the old note TRUE.
          # If this passes, the check cannot see the rot it exists to catch.
          T=$(mktemp -d)
          sed 's|ai.bithuman:expression2-android:[0-9.]*|ai.bithuman:expression2-android:0.3.0|' \
            packages/flutter-plugin/android/build.gradle > "$T/hist.gradle"
          if ./scripts/check_android_coordinates_on_central.sh "$T/hist.gradle" > "$T/out" 2>&1; then
            echo "::error::the 0.3.0 pin PASSED — the check is not looking at transitives"
            cat "$T/out"; exit 1
          fi
          grep -q 'com.google.ai.edge.litert:litert' "$T/out" || {
            echo "::error::it went red, but not on litert — it is failing for another reason"
            cat "$T/out"; exit 1; }
          echo "control fires, and names the right coordinate:"
          grep 'NOT ON CENTRAL' "$T/out"
      - name: Negative control — a version Central does not serve MUST go red
        run: |
          set -u
          T=$(mktemp -d)
          sed 's|ai.bithuman:essence2-android:[0-9.]*|ai.bithuman:essence2-android:99.99.99|' \
            packages/flutter-plugin/android/build.gradle > "$T/ghost.gradle"
          if ./scripts/check_android_coordinates_on_central.sh "$T/ghost.gradle" >/dev/null 2>&1; then
            echo "::error::an unpublished pin PASSED — the check is not looking"; exit 1
          fi
          echo "control fires: unpublished pin"

  # ── DEV LEVERS: one door per language, and a release build has no key ──────────────────
  # 2026-09-15/16: a persistent Android sysprop (our A/V sync marker) painted white frames on
  # every build after it, release included; a proof APK with BITHUMAN_DEV_STRESS + BH_MIC_FILE
  # sat on the owner's phone; the Apple plugin read 15 env vars in every build. Every read now
  # goes through DevLevers.swift (#if DEBUG) / dev_levers.dart (!kReleaseMode) / devInt()
  # (FLAG_DEBUGGABLE), and the server_vad threshold has one writer (echo_profile.dart).
  dev-levers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: every dev lever goes through its door; one echo-threshold writer
        run: ./scripts/check_dev_levers.sh
      - name: Negative controls — a stray read, a stripped guard and a second writer must each FAIL
        run: |
          set -u
          P=packages/flutter-plugin
          red() { if ./scripts/check_dev_levers.sh >/dev/null 2>&1; then echo "::error::$1 — the check PASSED; it is not looking"; exit 1; fi; echo "control fires: $1"; }
          F=$P/shared/Classes/SpeechPipeline.swift; cp "$F" /tmp/c1
          echo 'let stray = ProcessInfo.processInfo.environment["BH_STRAY"]' >> "$F"; red "stray Swift env read"; cp /tmp/c1 "$F"
          F=$P/lib/src/dev_levers.dart; cp "$F" /tmp/c2
          sed -i "s/enabled \&\& bool.fromEnvironment('BITHUMAN_DEV_STRESS')/bool.fromEnvironment('BITHUMAN_DEV_STRESS')/" "$F"; red "ungated Dart lever"; cp /tmp/c2 "$F"
          F=$P/lib/openai_webrtc_session.dart; cp "$F" /tmp/c3
          sed -i "s/'threshold': EchoProfile.current.serverVadThreshold,/'threshold': 0.5,/" "$F"; red "second server_vad literal"; cp /tmp/c3 "$F"
          ./scripts/check_dev_levers.sh

  dev-levers-release-arm:
    # The arm itself: the Swift door compiled as Release (-O, no DEBUG) and as Debug, run with
    # EVERY lever set — Release must print the unset row, Debug the sentinels. Needs swiftc.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: release ignores every lever, debug reads them
        run: ./scripts/prove_dev_levers_release.sh
      - name: Negative control — a door without '#if DEBUG' must FAIL the arm
        run: |
          set -u
          F=packages/flutter-plugin/shared/Classes/DevLevers.swift; cp "$F" /tmp/door.bak
          python3 - <<'PY'
          from pathlib import Path
          p = Path("packages/flutter-plugin/shared/Classes/DevLevers.swift"); s = p.read_text()
          s = s.replace("    #if DEBUG\n    return ProcessInfo.processInfo.environment[name]\n    #else\n    return nil\n    #endif", "    return ProcessInfo.processInfo.environment[name]")
          s = s.replace("    #if DEBUG\n    return true\n    #else\n    return false\n    #endif", "    return true")
          p.write_text(s)
          PY
          if ./scripts/prove_dev_levers_release.sh >/dev/null 2>&1; then echo "::error::the arm PASSED with the door's #if DEBUG removed — it is not looking"; cp /tmp/door.bak "$F"; exit 1; fi
          echo "control fires: door without #if DEBUG"
          cp /tmp/door.bak "$F"
          ./scripts/prove_dev_levers_release.sh

  # ── THE VOICE↔RENDER EDGE: voice must be standable with no render at all ────────────
  # 2026-09-16: RealtimeAudioIO (mic + speaker + VP-IO AEC) needs twelve things from the
  # render side and nothing else, and every reference was already `?.`-guarded —
  # playSpeakerPCM24k has always carried a no-avatar branch. It was UNREACHABLE anyway,
  # for exactly two reasons: the sink was typed as the concrete AvatarTexture, and
  # audioStart/localAudioStart bound textures[textureId] in their guard and refused
  # BAD_ARGS without one. Both are cut. An unreachable branch is silent, so this is the
  # gate that stops them growing back.
  voice-render-edge:
    # macOS because the compiled half needs swiftc. The source half runs anywhere.
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: the voice unit names no render class, and neither voice entry point requires a texture
        run: ./scripts/check_voice_render_edge.sh
      - name: the protocol compiles, is weak-holdable, and a NON-RENDER type satisfies all of it
        run: ./scripts/prove_lipsync_sink_headless.sh
      - name: Negative controls — an EXACT PARTITION, each mutation reddens only the rules that test it
        run: |
          set -u
          C=packages/flutter-plugin/shared/Classes
          cp $C/RealtimeAudioIO.swift /tmp/a.bak; cp $C/BithumanAvatarPlugin.swift /tmp/b.bak
          restore() { cp /tmp/a.bak $C/RealtimeAudioIO.swift; cp /tmp/b.bak $C/BithumanAvatarPlugin.swift; }
          mutate() { python3 scripts/ci/mutate_voice_render_edge.py "$1"; }
          grade() {
            label="$1"; shift
            out=$(./scripts/check_voice_render_edge.sh 2>&1) || true
            echo "$out"
            for want in "$@"; do
              echo "$out" | grep -q "FAIL  $want " || { echo "::error::$label — $want was expected to go RED and did not; the rule is not looking"; restore; exit 1; }
            done
            reds=$(echo "$out" | grep -c "FAIL  " || true)
            [ "$reds" -eq "$#" ] || { echo "::error::$label — $reds rules went red, expected exactly $# ($*). The partition is not exact."; restore; exit 1; }
            echo "control fires exactly: $label -> $*"
            restore
          }
          mutate M1; grade "M1 the sink typed as the render class again" R1a R1b
          mutate M2; grade "M2 audioStart binds a texture in its guard again" R2
          mutate M3; grade "M3 AvatarTexture stops declaring the conformance" R3a
          mutate M4; grade "M4 a protocol member vanishes from the texture" R3b
          ./scripts/check_voice_render_edge.sh

  # ── THE SAME EDGE, ONE LAYER UP, IN DART ──────────────────────────────────────────
  # The Swift voice unit stopped naming AvatarTexture on 2026-09-16; the DART voice
  # module was still opening with `import 'bithuman.dart'` and typing four constructors
  # `required BithumanAvatar avatar`. Same defect, same cost: "a voice session with no
  # avatar" was untypeable, so voice could only be tested through render. The edge is
  # TURNED — `BithumanAvatar implements VoiceHost` — and nothing about that is visible
  # at runtime: put the import back and the package still compiles and still ships.
  #
  # Pure python, so it runs on ubuntu. The COMPILED half of this boundary is
  # packages/flutter-plugin/test/e2e/headless_voice_host_test.dart, run by
  # flutter-plugin-tests.yml: a real BithumanRealtimeSession against a VoiceHost with no
  # render in it, which stops COMPILING if a constructor is re-typed.
  voice-render-edge-dart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: the Dart voice module does not import render, and the protocol is the measured surface
        run: ./scripts/check_voice_render_edge_dart.sh
      - name: Negative controls — an EXACT PARTITION, one mutation per rule
        run: |
          set -u
          L=packages/flutter-plugin/lib
          B=$(mktemp -d); trap 'rm -rf "$B"' EXIT HUP INT TERM
          mkdir -p "$B/src"
          cp $L/realtime_transport.dart $L/bithuman_realtime.dart $L/bithuman.dart "$B/"
          cp $L/src/transport_protocol.dart "$B/src/"
          restore() { cp "$B"/*.dart $L/; cp "$B"/src/*.dart $L/src/; }
          grade() {
            label="$1"; shift
            out=$(./scripts/check_voice_render_edge_dart.sh 2>&1) || true
            for want in "$@"; do
              echo "$out" | grep -q "FAIL  $want " || { echo "$out"; echo "::error::$label — $want was expected to go RED and did not; the rule is not looking"; restore; exit 1; }
            done
            reds=$(echo "$out" | grep -c "FAIL  " || true)
            [ "$reds" -eq "$#" ] || { echo "$out"; echo "::error::$label — $reds rules went red, expected exactly $# ($*). The partition is not exact."; restore; exit 1; }
            echo "control fires exactly: $label -> $*"
            restore
          }
          m() { python3 scripts/ci/mutate_voice_render_edge_dart.py "$1" >/dev/null; }
          m M1; grade "M1 the render import comes back"                  R1a
          m M2; grade "M2 a constructor is re-typed to the render class" R1b
          m M3; grade "M3 the conformance declaration disappears"        R2a
          m M4; grade "M4 a protocol member vanishes from the avatar"    R2b
          m M5; grade "M5 voice invokes a RENDER verb through the host"  R3
          m M6; grade "M6 the routing rule goes back to literals"        R4a
          m M7; grade "M7 a transport hard-codes its own capability"     R4b
          m M8; grade "M8 a registered id loses its build branch"        R4c
          ./scripts/check_voice_render_edge_dart.sh
