// bithuman — Android half of the umbrella plugin (expression-2 and essence-2 on device).
//
// The engines are the PUBLISHED `ai.bithuman:expression2-android` and
// `ai.bithuman:essence2-android` AARs from Maven Central, so a fresh clone builds with no
// private SDK and no vendor bundle. expression-2 needs google() beside mavenCentral():
// its LiteRT dependency lives on Google's Maven only. The two Qualcomm coordinates are
// the Hexagon NPU delegate that SDK loads when the SoC has one (Snapdragon); elsewhere
// they are inert. essence-2 resolves from Central alone.
//
// ★ The pin is 0.4.7, which the presenter needs: `Expression2IdleLoop` (the idle clip
// decoded in place, `next(bitmap)`) exists from 0.4.7 ONLY. Central's 0.4.6 — built
// before that change — ships `idleLoop` as a `List<Bitmap>` of 48 frames and has no
// `Expression2IdleLoop` class, so plugin 2.4.0's `implementation ...:0.4.6` did not
// compile against Central at all: it compiled only against a mavenLocal 0.4.6 built
// from a later main. Until 0.4.7 is public on Central this half resolves from
// mavenLocal only — a stranger's clone builds the Apple halves and NOT this one.
// Stated, not hidden.
group = 'ai.bithuman.flutter'
version = '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'ai.bithuman.flutter'
    compileSdk = 36
    defaultConfig {
        minSdk = 29   // essence2-android declares 29 (expression2-android 26); the app must match
        ndk { abiFilters 'arm64-v8a' }   // the AAR ships arm64-v8a only
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    implementation 'ai.bithuman:expression2-android:0.4.7'
    // 0.5.7: the first coordinate with `Essence2Avatar.idle` (the driver footage between
    // turns) and a meter that refuses without a credential rather than rendering free.
    implementation 'ai.bithuman:essence2-android:0.5.7'
    implementation 'com.qualcomm.qti:qnn-litert-delegate:2.49.0'
    implementation 'com.qualcomm.qti:qnn-runtime:2.49.0'
}

// ★ The app that imports this plugin must ALSO set, in its own android/app build file:
//     android { packaging { jniLibs { useLegacyPackaging = true } } }
// The Hexagon (QNN) delegate opens its libraries by PATH from the app's native-library
// directory; with the default (uncompressed, unextracted) packaging that path is empty,
// the SDK falls back to the CPU silently, and only `acceleratorNote` says why. A library
// cannot set packaging for the app that consumes it. (Measured, Galaxy S25+, 2026-09-14/15.)
