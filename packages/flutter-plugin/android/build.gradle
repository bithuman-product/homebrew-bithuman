// bithuman — Android half of the umbrella plugin (expression-2 and essence-2 on device).
//
// The engines are the PUBLISHED `ai.bithuman:expression2-android` and
// `ai.bithuman:essence2-android` AARs from Maven Central, so a fresh clone builds with no
// private SDK and no vendor bundle. BOTH engines resolve from mavenCentral() alone.
// google() stays in the lists below for AGP's own tooling (aapt2 and the build tools),
// NOT to resolve an engine.
//
// ★ It used to be otherwise, and the old note here outlived the fact. expression-2
// carried a transitive `com.google.ai.edge.litert:litert` — which is 404 on Central, so
// google() really was load-bearing — in 0.3.0 and in 0.3.0 ONLY. Every POM Central
// serves from 0.3.1 onward declares kotlin-stdlib and nothing else, the pinned 0.4.7
// included. The claim was three minors dead before it was deleted.
//
// The two Qualcomm coordinates below are the Hexagon NPU delegate the SDK loads when the
// SoC has one (Snapdragon); elsewhere they are inert. They are declared BY HAND because
// 0.4.7's POM does not carry them — Central's 0.4.8 POM is the first that does, so this
// pair must be revisited, not merely inherited, whenever the expression-2 pin moves.
// Both are on Central. essence-2 resolves from Central alone.
//
// ★ The pin is 0.4.7, which the presenter needs: `Expression2IdleLoop` (the idle clip
// decoded in place, `next(bitmap)`) exists from 0.4.7 ONLY. Central's 0.4.6 — built
// before that change — ships `idleLoop` as a `List<Bitmap>` of 48 frames and has no
// `Expression2IdleLoop` class, so plugin 2.4.0's `implementation ...:0.4.6` did not
// compile against Central at all: it compiled only against a mavenLocal 0.4.6 built
// from a later main. 0.4.7 is public on Central since 2026-09-16 — a stranger's clone
// builds this half from mavenCentral() alone (plugin 2.6.1 is the first tag that does).
group = 'ai.bithuman.flutter'
version = '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'ai.bithuman.flutter'
    compileSdk = 36
    defaultConfig {
        minSdk = 29   // essence2-android declares 29 (expression2-android 26); the app must match
        ndk { abiFilters 'arm64-v8a' }   // the AAR ships arm64-v8a only
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
    }
}

dependencies {
    implementation 'ai.bithuman:expression2-android:0.4.7'
    // 0.5.10 (public on Central since 2026-09-16, lastUpdated 20260916205927): A BARGE-IN
    // NO LONGER REWINDS THE DRIVER VIDEO TO ITS FIRST FRAME. Interrupt the agent mid-reply
    // and the video behind the avatar used to snap back to the start of its clip — every
    // cut and every new utterance seeded the next walk at driver frame 0 and the
    // composited face followed it there. It rides on the frame it was on now
    // (bithuman-models #774). ★ It is ONE default value —
    // `Essence2Avatar.resetAudio(startFrame: Int = 0 -> -1)` — and a Kotlin default lives
    // in `resetAudio$default`, not in a signature, so `api/essence2-android.api` is
    // byte-identical between 0.5.9 and 0.5.10 and NO api check could have caught it:
    // published 0.5.9 loads `iconst_0`, published 0.5.10 loads `iconst_m1`, and the
    // bytecode is the only place that says which behaviour shipped. AAR sha256
    // 4074a827835a534d… == Central's own .sha256 sidecar; lible_jni.so 59ddea6a3a64cbb4….
    //
    // 0.5.9 carries the warp prior played IN PLACE — `Identity::P(si)` a cursor over
    // `P_hevc.mov` instead of an offset into a 394,788,864 B `P.f16` the SDK expanded at
    // activate and mmap'd (#747): on a Galaxy S25+ engine create 891.1 -> 164.1 ms, RSS
    // after one lap 1,018,944 -> 683,268 kB, 394,788,864 -> 0 B written to app storage,
    // per-push 17.733 -> 16.454 ms, 304/304 delivered frames identical si for si. 0.5.8
    // carries the SDK's own motion thread — every frame of a reply comes out under THIS
    // plugin's un-paced transport, where 0.5.7 delivered 72-77 % (#737) — and the
    // driver-cursor fix (#738). 0.5.7 remains the first coordinate with
    // `Essence2Avatar.idle` and a meter that refuses without a credential rather than
    // rendering free.
    //
    // 0.5.12 (public on Central since 2026-09-19, lastUpdated 20260919172817): ESSENCE 2
    // DRAWS THE MOUTH WITH THE IDENTITY'S OWN LIP CONTOUR. Every Android AAR before it
    // drew that region as a wider ellipse — not for want of the contour (the engine has
    // carried the bind since 0.5.11) but because the Android publishing step rewrote each
    // identity's model onto a mouth tile whose shape the load-time bind does not
    // recognise, so on Android alone the bind declined and the wider region is what a
    // customer saw. 0.5.12 publishes the plain student form for the Android row and the
    // bind takes. Measured through the PUBLISHED bytes on an SM-S936U1 rendering
    // A23KSG5258: the engine reports the lip contour bound at load (20 verts, feather
    // 6.0 px) and that the wider region is not reachable in that session, its refusal
    // line — which IS compiled into the shipped library, so the path can decline — never
    // fires, and the mouth is still taken entirely from the identity's own recorded
    // texture (0.000000 mean / 0.000000 max generated share over 62 rendered frames).
    // Measured on the pin itself, 2026-09-20: Gradle resolves this coordinate from
    // repo1.maven.org, a release APK built against it carries lible_jni.so byte-identical
    // (sha256 083ee4e5950ba3da…) to the one inside Central's AAR, and that library answers
    // `strings … lip_delivery` 4 where 0.5.10's answers 0. AAR sha256
    // 8512fc644bcbed156d5656409082faf0e02eabbbf699e4e757d35213995823ac (12,090,958 B) ==
    // Central's own .sha256 sidecar, fetched anonymously.
    //
    // ★ THE PIN MOVES ONLY AFTER CENTRAL SERVES THE VERSION, NEVER AFTER A LOCAL PUBLISH.
    // `mavenLocal()` is in the repository list below mavenCentral(), and measured
    // 2026-09-16 it cannot SHADOW a version Central serves — a poisoned ~/.m2 holding a
    // different artifact at 0.5.8 still resolved Central's bytes. What it CAN do is
    // supply a version Central LACKS, which is how plugin 2.4.0 came to import a class
    // Central's 0.4.6 did not have: `publishToMavenLocal` plus a pin bump compiles green
    // while no customer can resolve it. This pin was moved only once repo1.maven.org
    // served 0.5.12 (fetched anonymously 2026-09-20; the sha256 above is the sidecar's).
    implementation 'ai.bithuman:essence2-android:0.5.12'
    implementation 'com.qualcomm.qti:qnn-litert-delegate:2.49.0'
    implementation 'com.qualcomm.qti:qnn-runtime:2.49.0'
}

// ★ The app that imports this plugin must ALSO set, in its own android/app build file:
//     android { packaging { jniLibs { useLegacyPackaging = true } } }
// The Hexagon (QNN) delegate opens its libraries by PATH from the app's native-library
// directory; with the default (uncompressed, unextracted) packaging that path is empty,
// the SDK falls back to the CPU silently, and only `acceleratorNote` says why. A library
// cannot set packaging for the app that consumes it. (Measured, Galaxy S25+, 2026-09-14/15.)
