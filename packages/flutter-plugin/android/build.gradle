// bithuman — Android half of the umbrella plugin (expression-2 and essence-2 on device).
//
// The engines are the PUBLISHED `ai.bithuman:expression2-android` and
// `ai.bithuman:essence2-android` AARs, so a fresh clone builds with no private SDK and no
// vendor bundle. google() stays in the lists below for AGP's own tooling (aapt2 and the
// build tools), NOT to resolve an engine.
//
// ★ WHERE THE ENGINES COME FROM (2026-09-30). bitHuman publishes `ai.bithuman` to its own
// Maven repository, https://maven.bithuman.ai, and no longer to Maven Central; the versions
// already on Central stay there and are served by maven.bithuman.ai too. This file adds that
// repository to EVERY project of the app (rootProject.allprojects below), so a Flutter app
// that depends on this plugin resolves the engines with nothing added to its own Gradle
// files. It is a CONTENT FILTER (`includeGroup "ai.bithuman"`), not `exclusiveContent`, on
// purpose: Gradle asks maven.bithuman.ai for ai.bithuman only; a version Central still
// serves keeps resolving from Central first; and an app whose own settings already declare
// maven.bithuman.ai as the exclusive home of ai.bithuman (the native Android docs do) keeps
// working, because this filter never competes with an exclusive declaration. The engines'
// own dependencies (kotlin-stdlib, com.qualcomm.qti) are still Central's.
//
// ★ It used to be otherwise, and the old note here outlived the fact. expression-2
// carried a transitive `com.google.ai.edge.litert:litert` — which is 404 on Central, so
// google() really was load-bearing — in 0.3.0 and in 0.3.0 ONLY. Every POM Central
// serves from 0.3.1 onward declares kotlin-stdlib and nothing else, the pinned 0.4.7
// included. The claim was three minors dead before it was deleted.
//
// The Qualcomm Hexagon NPU delegate + runtime (com.qualcomm.qti:qnn-litert-delegate and
// qnn-runtime, 2.49.0) come in TRANSITIVELY: expression2-android 0.4.8 is the first POM that
// declares them, so the two hand-declared lines this file carried for 0.4.7 are gone.
// Revisit if the expression-2 pin ever moves BELOW 0.4.8 — 0.4.7's POM does not carry them
// and the engine would silently render on the CPU. essence-2 0.9.0 is the first engine
// Central does NOT serve: it resolves from maven.bithuman.ai alone (its one dependency,
// kotlin-stdlib, from Central). scripts/check_android_coordinates_on_central.sh grades
// every ai.bithuman pin against maven.bithuman.ai and everything else against Central.
//
// ★ The floor is 0.4.7, which the presenter needs: `Expression2IdleLoop` (the idle clip
// decoded in place, `next(bitmap)`) exists from 0.4.7 ONLY. Central's 0.4.6 — built
// before that change — ships `idleLoop` as a `List<Bitmap>` of 48 frames and has no
// `Expression2IdleLoop` class, so plugin 2.4.0's `implementation ...:0.4.6` did not
// compile against Central at all: it compiled only against a mavenLocal 0.4.6 built
// from a later main. 0.4.7 is public on Central since 2026-09-16 — a stranger's clone
// builds this half from mavenCentral() alone (plugin 2.6.1 is the first tag that does).
group = 'ai.bithuman.flutter'
version = '0.1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.1.0'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // ★ Never ai.bithuman (2.6.27). mavenLocal() sits ABOVE maven.bithuman.ai here, and a
        // build host's ~/.m2 can hold an engine candidate that was never published (a lane's
        // `publishToMavenLocal`, e.g. essence2-android 0.8.0-cand1). For a version only
        // maven.bithuman.ai serves (0.9.0 on), the local copy would be the one a store build
        // resolved. With the group excluded, the engines resolve from their published home only.
        mavenLocal {
            content { excludeGroup("ai.bithuman") }
        }
        // ai.bithuman (both engines), from bitHuman's own repository. See the header.
        maven {
            url = uri("https://maven.bithuman.ai")
            content { includeGroup("ai.bithuman") }
        }
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace = 'ai.bithuman.flutter'
    compileSdk = 36
    defaultConfig {
        minSdk = 29   // essence2-android declares 29 (expression2-android 26); the app must match
        ndk { abiFilters 'arm64-v8a' }   // the AAR ships arm64-v8a only
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        main.kotlin.srcDirs += 'src/main/kotlin'
        test.kotlin.srcDirs += 'src/test/kotlin'
    }
}

dependencies {
    // 0.4.9 (2026-09-23): the FIRST on-device session meter — talking time only, idle free
    // (the rule then; since 2026-09-26 the service bills active session time, talking or idle);
    // a create without an API secret is refused (Expression2Metering.NO_SESSION).
    // 0.4.10 (2026-09-23): Expression2Credential.set(secret) is the one setter for the meter and
    // the store's metered door; Expression2Metering.apiSecret stays, deprecated (#1223).
    // 0.5.0 (2026-09-24): Expression 2 lip sync — the first frame of each stream is shown twice,
    // so the mouth no longer leads the voice (SyncNet on the S25+: about -60 ms before, within
    // 25 ms after); the frame count is unchanged. Store retries share one budget per store.
    // 0.5.1 (2026-09-26): each installation names itself on the meter; the meter talks only to
    // bitHuman hosts (an app-set endpoint elsewhere is ignored).
    // 0.6.0 (2026-10-03, maven.bithuman.ai): an installed avatar picks up server-side repairs —
    // Expression2ModelStore.fetch() returns the installed copy at once, checks for an update in the
    // background (at most hourly) and swaps a changed file in on the NEXT fetch(); an installed avatar
    // never fails to open because the network is down. A first open killed mid-prepare finishes in the
    // background (a JobScheduler service in the AAR's manifest); idle frames bill from the first frame.
    // Security: a cached private avatar opens only for a credential the door has said yes to.
    implementation 'ai.bithuman:expression2-android:0.6.0'
    // 0.5.10 (public on Central since 2026-09-16, lastUpdated 20260916205927): A BARGE-IN
    // NO LONGER REWINDS THE DRIVER VIDEO TO ITS FIRST FRAME. Interrupt the agent mid-reply
    // and the video behind the avatar used to snap back to the start of its clip — every
    // cut and every new utterance seeded the next walk at driver frame 0 and the
    // composited face followed it there. It rides on the frame it was on now
    // (bithuman-models #774). ★ It is ONE default value —
    // `Essence2Avatar.resetAudio(startFrame: Int = 0 -> -1)` — and a Kotlin default lives
    // in `resetAudio$default`, not in a signature, so `api/essence2-android.api` is
    // byte-identical between 0.5.9 and 0.5.10 and NO api check could have caught it:
    // published 0.5.9 loads `iconst_0`, published 0.5.10 loads `iconst_m1`, and the
    // bytecode is the only place that says which behaviour shipped. AAR sha256
    // 4074a827835a534d… == Central's own .sha256 sidecar; lible_jni.so 59ddea6a3a64cbb4….
    //
    // 0.5.9 carries the warp prior played IN PLACE — `Identity::P(si)` a cursor over
    // `P_hevc.mov` instead of an offset into a 394,788,864 B `P.f16` the SDK expanded at
    // activate and mmap'd (#747): on a Galaxy S25+ engine create 891.1 -> 164.1 ms, RSS
    // after one lap 1,018,944 -> 683,268 kB, 394,788,864 -> 0 B written to app storage,
    // per-push 17.733 -> 16.454 ms, 304/304 delivered frames identical si for si. 0.5.8
    // carries the SDK's own motion thread — every frame of a reply comes out under THIS
    // plugin's un-paced transport, where 0.5.7 delivered 72-77 % (#737) — and the
    // driver-cursor fix (#738). 0.5.7 remains the first coordinate with
    // `Essence2Avatar.idle` and a meter that refuses without a credential rather than
    // rendering free.
    //
    // 0.5.12 (public on Central since 2026-09-19, lastUpdated 20260919172817): ESSENCE 2
    // DRAWS THE MOUTH WITH THE IDENTITY'S OWN LIP CONTOUR. Every Android AAR before it
    // drew that region as a wider ellipse — not for want of the contour (the engine has
    // carried the bind since 0.5.11) but because the Android publishing step rewrote each
    // identity's model onto a mouth tile whose shape the load-time bind does not
    // recognise, so on Android alone the bind declined and the wider region is what a
    // customer saw. 0.5.12 publishes the plain student form for the Android row and the
    // bind takes. Measured through the PUBLISHED bytes on an SM-S936U1 rendering
    // A23KSG5258: the engine reports the lip contour bound at load (20 verts, feather
    // 6.0 px) and that the wider region is not reachable in that session, its refusal
    // line — which IS compiled into the shipped library, so the path can decline — never
    // fires, and the mouth is still taken entirely from the identity's own recorded
    // texture (0.000000 mean / 0.000000 max generated share over 62 rendered frames).
    // Measured on the pin itself, 2026-09-20: Gradle resolves this coordinate from
    // repo1.maven.org, a release APK built against it carries lible_jni.so byte-identical
    // (sha256 083ee4e5950ba3da…) to the one inside Central's AAR, and that library answers
    // `strings … lip_delivery` 4 where 0.5.10's answers 0. AAR sha256
    // 8512fc644bcbed156d5656409082faf0e02eabbbf699e4e757d35213995823ac (12,090,958 B) ==
    // Central's own .sha256 sidecar, fetched anonymously.
    //
    // ★ THE PIN MOVES ONLY AFTER CENTRAL SERVES THE VERSION, NEVER AFTER A LOCAL PUBLISH.
    // `mavenLocal()` was in the repository list below mavenCentral(), and measured
    // 2026-09-16 it cannot SHADOW a version Central serves — a poisoned ~/.m2 holding a
    // different artifact at 0.5.8 still resolved Central's bytes. What it CAN do is
    // supply a version Central LACKS, which is how plugin 2.4.0 came to import a class
    // Central's 0.4.6 did not have: `publishToMavenLocal` plus a pin bump compiles green
    // while no customer can resolve it. This pin was moved only once repo1.maven.org
    // served 0.5.12 (fetched anonymously 2026-09-20; the sha256 above is the sidecar's).
    // Since 2.6.27 mavenLocal() excludes the ai.bithuman group outright (see the
    // repositories above), so no engine can come from a host's ~/.m2 at all.
    //
    // 0.5.13 (public on Central since 2026-09-23): THE AAR KEEPS ITS OWN JNI BRIDGE THROUGH A
    // CONSUMER'S R8. 0.5.12 shipped no proguard.txt, so an app whose release build named its
    // own proguardFiles(...) without AGP's default file had NativeBridge renamed and threw
    // UnsatisfiedLinkError at the first create() (measured on a Galaxy S25+). A Flutter
    // release build always includes the default file, so this plugin was not exposed; the
    // pin moves so the plugin carries the current engine. Engine output unchanged: same
    // handset proof as 0.5.12 (lip contour bound, generated mouth share 0/0).
    // 0.5.14 (2026-09-23): the meter bills talking time only (idle is free; the rule then —
    // since 2026-09-26 the service bills active session time, talking or idle); a key the
    // service never vouched for renders 0 frames; an outage after vouching renders 300 s of
    // frames, then pauses until the service answers; BITHUMAN_API_KEY read as an alias.
    // 0.5.15 (2026-09-23): Essence2Credential.set(secret) is the one setter for the door and the
    // meter, and every type an app touches is in ai.bithuman.essence2 (#1223).
    // 0.6.0 (2026-09-24): the first frame after a listening gap arrives about 4x sooner
    // (resetAudio seeds the next reply where the picture is); store retries share one budget
    // per store; renders are bit-identical to 0.5.15.
    // 0.8.0 (2026-09-26): useHardwareBuffers takes up to 32 slots (was 16), which the zero-copy
    // path below needs: the player's ring holds one frame per slot until the slot comes round.
    // 0.9.0 (2026-10-01, maven.bithuman.ai only): the generated mouth is blended into the photo
    // with a wider, feathered edge, so no step shows at the mouth corners. Measured against 0.8.1
    // on a Galaxy Z Flip5, interleaved: frame rate +1.1 % / -0.1 % (older / current avatar files),
    // memory within 4 MiB. No API change.
    // 0.9.1 (2026-10-02, maven.bithuman.ai only): SISTER-CORE PLACEMENT + SKIP-AHEAD. 0.9.0 pinned
    // the engine's pool into the app's whole cpuset (on a Galaxy Z Flip5: 3 little + 3 big cores), and
    // a phone that rendered below real time showed a face frozen behind the voice — bitHuman Live,
    // Sofia: 10-20 fps rendered against the 25 the voice needs, the presenter dropping every late
    // frame. 0.9.1 places its threads on the non-little cores and adds `setPlayoutPosition` /
    // `lastFrameIndex` / `skippedFrames`: told where the voice is (AvatarEngine.kt, PlayoutClock.kt),
    // it skips the render of a frame whose audio has already gone out, so a slow phone shows fewer
    // frames, each on its own audio (the plugin's clock is OFF by default in 2.6.29:
    // `BithumanAvatar.load(skipAhead: true)` turns it on). The idle walk only moves forward (a
    // skipped frame no longer sends the cursor back past its decoded history). `idle(ByteBuffer)` is
    // legal again in zero-copy mode (the cursor step after every speech frame). Additive API; the
    // plugin needs it from 2.6.29. Same store behaviour as 0.9.0.
    // 0.9.2 (2026-10-02, maven.bithuman.ai only): ADAPTIVE 720p WHILE THROTTLED. On a phone that caps its GPU
    // after a while in calls, the engine renders the identity's published 720p output and scales it into the same
    // full-size frame (Sofia: 1080x1920), then returns to full resolution once the phone cools; the store fetches
    // that ~4.8 MB member after the first session on 0.9.2 and the step-down arms from the next. The frames the
    // plugin receives keep their size, so the presenter is unchanged. Galaxy Z Flip5 at the deepest throttle
    // (10x Efficiency): shown/due median ~75%, 37% on 0.9.1. AAR sha256 92c1fde5b38a07f9… (as served).
    // 0.9.3 (2026-10-03, maven.bithuman.ai only, cut from main): an installed avatar opens in ~3 s (the engine keeps
    // its compiled GPU programs per device + driver and prepares the teeth data during the credential check; Flip5:
    // 2.5-4.3 s vs 6.0-11.2 s on 0.9.2; the first open after install compiles once, ~5 s); a cache hit no longer
    // waits for the door (background re-check, at most hourly); the first download asks the door once, fetches 4 at
    // once, resumes and continues in the background as a JobScheduler job (no foreground service, no notification;
    // the AAR adds ACCESS_NETWORK_STATE + a BIND_JOB_SERVICE-protected service to the merged manifest); an identity
    // installed before the mouth-corner re-publish is refreshed or refused with the fix (the plugin's half of this is
    // in place since 2.6.29 and acts from this pin); a killed session is billed its active seconds on the next start.
    // Same API for the plugin (additive only). Step-down and skip-ahead unchanged from 0.9.2. AAR sha256
    // b1f5534669793012… (as served).
    // 0.9.4 (2026-10-04, maven.bithuman.ai): SECURITY — a cached private avatar opens only for a credential the
    // door has said yes to (another account gets the door's 404 NOT_FOUND); the first open of each cached avatar
    // after the upgrade asks the door once. Store-only change: engine, rendering and billing are 0.9.3's.
    implementation 'ai.bithuman:essence2-android:0.9.4'

    // Plain-JVM unit tests of the platform-free parts (src/test/kotlin: EngineUsersTest — dispose
    // closes an engine only after its threads returned). Test scope only: nothing ships in the AAR.
    testImplementation 'junit:junit:4.13.2'
}

// ★ The app that imports this plugin must ALSO set, in its own android/app build file:
//     android { packaging { jniLibs { useLegacyPackaging = true } } }
// The Hexagon (QNN) delegate opens its libraries by PATH from the app's native-library
// directory; with the default (uncompressed, unextracted) packaging that path is empty,
// the SDK falls back to the CPU silently, and only `acceleratorNote` says why. A library
// cannot set packaging for the app that consumes it. (Measured, Galaxy S25+, 2026-09-14/15.)
