name: bithuman
description: "bitHuman avatars on the device for Flutter (Android, iOS, macOS): Expression 2 and Essence 2, with a voice conversation through the bitHuman realtime relay."
version: 2.6.36
homepage: https://www.bithuman.ai
repository: https://github.com/bithuman-product/homebrew-bithuman
issue_tracker: https://github.com/bithuman-product/homebrew-bithuman/issues
documentation: https://docs.bithuman.ai/platforms/flutter

environment:
  sdk: ^3.11.5
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  web_socket_channel: ^3.0.3

  # Shared realtime layer. The default session is a WebSocket to bitHuman's
  # realtime relay (your API secret, no token to mint); flutter_webrtc carries
  # the optional WebRTC transport (libwebrtc owns mic/speaker/AEC + the
  # RTCAudioRenderer lipsync tap).
  # Pinned to 1.4.0 exactly: it locks WebRTC-SDK 144.7559.01, whose macOS
  # deployment target matches this pod's. 1.4.1+ pulls a newer WebRTC-SDK that
  # needs a higher macOS min than the podspec declares, and pod install fails.
  http: ^1.2.0
  flutter_webrtc: 1.4.0
  # SHA-256 / HMAC for the avatar caches' entitlement marks (2.6.36): a salted hash of the credential
  # names the mark and an HMAC seals it, so the key is never written to disk. Already in every app's
  # graph through web_socket_channel (crypto ^3.0.0), so this adds no package.
  crypto: ^3.0.0
  # The Layer-0 engine contract (EngineDescriptor + kEngineRegistry) is now
  # inlined at lib/src/engine_protocol.dart and re-exported by
  # lib/engine_registry.dart — no separate pub.dev package, so the plugin is
  # self-contained (one package to publish). The Swift half stays a product in
  # the homebrew-bithuman SwiftPM package for the engine SDKs.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # The hermetic OpenAI-Realtime stand-in the headless harness under
  # test/e2e/ dials. It lives IN THIS PACKAGE (e2e/mock_realtime), so the
  # reference is a PATH, not a git pin: the product app reached it by
  # `git: ref: <sha>` and that pin sat 43 commits behind main. A path
  # dependency cannot go stale — the mock and the client it mocks move in
  # the same commit or not at all. dev_dependencies are not resolved by
  # consumers of a published package, so this never reaches a pub.dev user.
  mock_realtime:
    path: e2e/mock_realtime

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # bitHuman avatar plugin — Android, iOS and macOS. pluginClass registers the
  # native plugin for the method channels; Android resolves the engines from
  # maven.bithuman.ai, iOS and macOS link the ones scripts/bootstrap.sh stages.
  # dartPluginClass: Flutter's plugin registrant calls BithumanLicenses.registerWith() at app start,
  # which adds the on-device brain's third-party licences (the assets below) to LicenseRegistry, so
  # every app's licence page lists them (lib/src/third_party_licenses.dart).
  plugin:
    platforms:
      ios:
        pluginClass: BithumanPlugin
        dartPluginClass: BithumanLicenses
      macos:
        pluginClass: BithumanPlugin
        dartPluginClass: BithumanLicenses
      android:
        package: ai.bithuman.flutter
        pluginClass: BithumanPlugin
        dartPluginClass: BithumanLicenses

  # The third-party licence texts, verbatim (licenses/SOURCES.md says where each comes from). One
  # line per directory: a directory entry takes the files directly in it, not its subdirectories,
  # so licenses/SOURCES.md is not bundled. test/third_party_licenses_test.dart checks this list
  # against BithumanLicenses.all.
  assets:
    - licenses/supertonic-3/
    - licenses/parakeet-tdt_ctc-110m/
    - licenses/silero-vad/
    - licenses/llama-3.2/
    - licenses/supertonic/
    - licenses/sherpa-onnx/
    - licenses/kaldi-native-fbank/
    - licenses/kissfft/
    - licenses/kaldi-decoder/
    - licenses/kaldifst/
    - licenses/openfst/
    - licenses/simple-sentencepiece/
    - licenses/eigen/
    - licenses/hclust-cpp/
    - licenses/nlohmann-json/
    - licenses/onnxruntime/
    - licenses/llama.cpp/
    - licenses/miniaudio/
  #
  # For details regarding assets in packages, see
  # https://flutter.dev/to/asset-from-package
  #
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # To add custom fonts to your plugin package, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts in packages, see
  # https://flutter.dev/to/font-from-package
